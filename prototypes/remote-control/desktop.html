<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>tx remote</title>
<style>
  /* The DESKTOP face of tx remote (the phone face is mobile.html): same dark messenger idiom —
     black canvas, grey received bubbles, blue sent bubbles — but laid out as a persistent
     split-pane: conversation list left, thread right, both always visible. Hover instead of
     press states, a selected-row highlight, no back button. Only code spans/blocks stay
     monospace. Tag chips keep the terminal picker's per-tag colors; session state its dot. */
  :root {
    --bg: #000; --panel: #0d0d10; --row-sep: #1c1c1f;
    --bubble: #26262b; --sent: #0a84ff;
    --fg: #fff; --dim: #98989f; --muted: #6c6c72;
    --blue: #0a84ff; --green: #30d158; --red: #ff453a; --amber: #ffd60a; --cyan: #64d2ff; --magenta: #bf5af2;
    --code-bg: #151519;
  }
  .s-working { --state: var(--green); }
  .s-waiting { --state: var(--blue); }
  .s-idle    { --state: var(--muted); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100dvh; margin: 0; color-scheme: dark; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.35 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Split-pane grid filling the whole window: list column (header + rows + the ask bar) left,
     thread right. No width cap — a desktop client owns its window; the bubble max-width keeps
     text readable. */
  #app { flex: 1 1 auto; min-height: 0; display: grid;
         grid-template-columns: 340px minmax(0, 1fr);
         grid-template-rows: auto minmax(0, 1fr) auto;
         width: 100%; }
  button { font: inherit; background: none; border: none; color: inherit; cursor: pointer; padding: 0; }

  /* ---- list header: just a search pill + the live dot (no big title) ------------------------- */
  #listHeader { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 10px;
                padding: 10px 14px 8px; border-right: .5px solid var(--row-sep); }
  #search { flex: 1 1 auto; min-width: 0; background: var(--bubble); border: none; color: var(--fg);
            border-radius: 18px; padding: 8px 15px; font: inherit; font-size: 16px;
            -webkit-appearance: none; appearance: none; }
  #search::placeholder { color: var(--muted); }
  #search:focus { outline: none; }
  #listHeader .live { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #listHeader .live.on { background: var(--green); }

  /* ---- conversation list --------------------------------------------------------------------- */
  #list { grid-column: 1; grid-row: 2; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
          border-right: .5px solid var(--row-sep); }
  .conv { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
          padding: 9px 16px; }
  .conv:hover { background: var(--panel); }
  .conv.selected, .conv.selected:hover { background: var(--bubble); }
  .conv .need { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; }   /* the unread dot */
  .conv .need.blocked { background: var(--red); }
  .conv .need.ready { background: var(--blue); }
  .avatar { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #2c2c31; color: var(--fg); font-weight: 600; font-size: 18px;
            position: relative; text-transform: uppercase; }
  .avatar::after {   /* state as a tiny status badge on the avatar, like presence */
    content: ""; position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px;
    border-radius: 50%; background: var(--state); border: 2.5px solid var(--bg);
  }
  .conv .mid { flex: 1 1 auto; min-width: 0; }
  .conv .nrow { display: flex; align-items: baseline; gap: 8px; }
  .conv .cname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; font-size: 17px; font-weight: 400; }
  .conv.needs .cname { font-weight: 600; }
  .conv .ctime { flex: 0 0 auto; color: var(--muted); font-size: 13px; }
  .conv .cprev { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                 color: var(--dim); font-size: 14px; margin-top: 1px; }
  .conv.needs .cprev { color: var(--fg); }
  .conv.dimmed .cname, .conv.dimmed .cprev { color: var(--muted); }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .chip { font-size: 10px; padding: 0 7px; border-radius: 999px; line-height: 16px;
          color: var(--chip, var(--dim)); border: 1px solid color-mix(in srgb, var(--chip, var(--dim)) 55%, transparent); }
  .conv + .conv .mid, .conv + .conv .ctime { border-top: none; }
  .conv:not(:last-child) { border-bottom: .5px solid var(--row-sep); }
  #listEmpty { padding: 48px 16px; color: var(--muted); text-align: center; }
  #listEmpty[hidden] { display: none; }

  /* ---- multi-select → ask the tx-assistant ---------------------------------------------------- */
  /* selection circle on each row's right edge; the wrap pads the click target. Selecting any row
     docks #askbar under the list column — a composer whose recipient is ALWAYS the tx-assistant. */
  .conv .pickwrap { flex: 0 0 auto; padding: 9px 0 9px 9px; margin: -9px 0; align-self: center; }
  .conv .pick { display: flex; align-items: center; justify-content: center;
                width: 22px; height: 22px; border-radius: 50%;
                border: 1.5px solid #3a3a3f; color: transparent; font-size: 12px; font-weight: 700; }
  .conv .pickwrap:hover .pick { border-color: var(--dim); }
  .conv .pick.on { background: var(--sent); border-color: var(--sent); color: #fff; }
  #askbar { grid-column: 1; grid-row: 3; padding: 8px 12px 12px;
            background: var(--panel);
            border-top: .5px solid var(--row-sep); border-right: .5px solid var(--row-sep); }
  #askbar[hidden] { display: none; }
  #askbar .to { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
                padding: 0 4px 7px; font-size: 13px; color: var(--muted); }
  #askbar .to b { color: var(--magenta); font-weight: 650; }
  #askbar .to .about { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #askHint { display: none; margin-top: 5px; color: var(--muted); font-size: 11.5px; text-align: center; }
  #askHint.show { display: block; }
  #askHint.err { color: var(--red); }
  /* the about-envelope prefix of a sent bubble, rendered as a small chip instead of raw XML */
  .turn .aboutchip { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 7px;
                     margin-right: 4px; vertical-align: 1px; border-radius: 999px;
                     border: 1px solid rgba(255,255,255,.4); }

  /* ---- thread (always visible; an empty-state placeholder before any selection) --------------- */
  #thread { grid-column: 2; grid-row: 1 / 4; min-height: 0; min-width: 0;
            display: flex; flex-direction: column; }
  #threadEmpty { display: none; }
  #thread.empty #threadEmpty { flex: 1 1 auto; display: flex; align-items: center;
                               justify-content: center; color: var(--muted); }
  #thread.empty #threadHead, #thread.empty #banner, #thread.empty #turns,
  #thread.empty #composer { display: none; }
  #threadHead { flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
                padding: 8px 16px; background: var(--panel);
                border-bottom: .5px solid var(--row-sep); }
  #threadHead .avatar { flex: 0 0 32px; width: 32px; height: 32px; font-size: 14px; }
  #threadHead .avatar::after { width: 10px; height: 10px; border: 2px solid var(--panel); }
  #threadHead .tname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                       white-space: nowrap; font-weight: 600; font-size: 16px; }
  /* context-used readout, top right — green → amber (>55) → red (>80); taps open the sheet */
  #threadHead .ctxpct { flex: 0 0 auto; font-size: 13px; font-weight: 600;
                        font-variant-numeric: tabular-nums; color: var(--green); padding: 4px 2px; }
  #threadHead .ctxpct.warn { color: var(--amber); }
  #threadHead .ctxpct.hot { color: var(--red); }

  #banner { flex: 0 0 auto; padding: 6px 14px; font-size: 12.5px; color: var(--red);
            background: color-mix(in srgb, var(--red) 12%, transparent);
            border-bottom: .5px solid var(--row-sep); }
  #banner b { font-weight: 600; }
  #banner[hidden] { display: none; }

  #turns { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
           padding: 10px 12px 6px; display: flex; flex-direction: column; }
  .tsep { align-self: center; color: var(--muted); font-size: 11px; font-weight: 600;
          margin: 12px 0 4px; }
  .turn { max-width: min(78%, 620px); padding: 7px 13px; border-radius: 18px; margin: 1px 0;
          white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 1.35; }
  .turn.agent { align-self: flex-start; background: var(--bubble); }
  .turn.you   { align-self: flex-end; background: var(--sent); color: #fff; }
  /* grouped corners, Messenger-style: consecutive same-sender bubbles flatten their facing corners */
  .turn.agent.g-top { border-bottom-left-radius: 5px; }
  .turn.agent.g-mid { border-top-left-radius: 5px; border-bottom-left-radius: 5px; }
  .turn.agent.g-bot { border-top-left-radius: 5px; }
  .turn.you.g-top { border-bottom-right-radius: 5px; }
  .turn.you.g-mid { border-top-right-radius: 5px; border-bottom-right-radius: 5px; }
  .turn.you.g-bot { border-top-right-radius: 5px; }
  .turn.g-top, .turn.g-solo { margin-top: 8px; }
  .turn.g-bot, .turn.g-solo { margin-bottom: 2px; }
  .turn.tools { align-self: center; background: none; color: var(--muted); font-size: 11px;
                padding: 3px 0; margin: 0; }
  /* a live AskUserQuestion rendered as tappable options — the chat-native answer to a dialog */
  .qcard { align-self: stretch; margin: 10px 0 4px; padding: 12px 14px;
           background: #131316; border: 1px solid var(--row-sep); border-radius: 14px; }
  .qcard .qtext { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .qopt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 13px;
          background: var(--bubble); border: 1px solid transparent; border-radius: 11px;
          font: inherit; color: var(--fg); }
  .qopt:hover { border-color: var(--blue); }
  .qopt .qlabel { display: block; font-size: 15px; font-weight: 600; color: var(--blue); }
  .qopt .qdesc { display: block; font-size: 12.5px; color: var(--dim); margin-top: 2px; }
  .qcard .qhint { display: block; margin-top: 8px; color: var(--muted); font-size: 11.5px; }

  /* the typing bubble — shown while the session is WORKING, instead of any text hint */
  .typing { align-self: flex-start; background: var(--bubble); border-radius: 18px;
            padding: 13px 15px; margin: 8px 0 2px; display: flex; gap: 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--dim);
                 animation: tblink 1.3s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes tblink {
    0%, 60%, 100% { opacity: .3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }
  /* its miniature, riding the conversation row's preview line */
  .typing.mini { background: none; padding: 2px 0 0; margin: 0; }
  .typing.mini span { width: 5px; height: 5px; }
  /* markdown, kept readable inside the chat idiom; code stays monospace */
  .turn b { font-weight: 650; }
  .turn i { font-style: italic; }
  .turn a { color: inherit; text-decoration: underline; }
  .turn.agent a { color: var(--cyan); text-decoration: none; }
  .mdcode, .mdblock { font: 13.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .turn.agent .mdcode { background: var(--code-bg); border-radius: 4px; padding: 0 4px; color: var(--cyan); }
  .turn.you .mdcode { background: rgba(255,255,255,.18); border-radius: 4px; padding: 0 4px; }
  .mdblock { display: block; background: var(--code-bg); border-radius: 8px;
             padding: 8px 10px; margin: 6px 0; overflow-x: auto; white-space: pre; color: var(--dim); }
  .turn .mdhead { font-weight: 700; }
  .turn .mdquote { color: var(--dim); }

  /* ---- composer (pill input + circular send, minimal) ----------------------------------------- */
  /* The pill + send-circle styles are shared with #askbar's composer, so the two feel identical. */
  #composer { flex: 0 0 auto; padding: 8px 12px 12px; }
  #composer .frow, #askbar .frow { display: flex; align-items: flex-end; gap: 8px; }
  /* Messenger-style growing composer: starts as a one-line pill, expands with the text up to
     ~5 lines, then scrolls internally. A textarea, so wrapping is native; height is set by the
     autogrow JS from scrollHeight. */
  #input, #askInput { flex: 1 1 auto; background: var(--bubble); border: none; color: var(--fg);
           border-radius: 20px; padding: 9px 16px; font: inherit; font-size: 16px; min-width: 0;
           resize: none; max-height: 132px; overflow-y: hidden; line-height: 1.35; }
  #input::placeholder, #askInput::placeholder { color: var(--muted); }
  #input:focus, #askInput:focus { outline: none; }
  #send, #askSend { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; background: var(--sent);
          color: #fff; font-size: 19px; font-weight: 700; line-height: 1;
          display: flex; align-items: center; justify-content: center; }
  #send:disabled, #askSend:disabled { background: var(--bubble); color: var(--muted); }
  #plus { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; background: var(--bubble);
          color: var(--blue); font-size: 22px; font-weight: 400; line-height: 1;
          display: flex; align-items: center; justify-content: center; }
  #file { display: none; }
  .imgmsg { display: block; max-width: min(240px, 62vw); border-radius: 12px; margin: 2px 0; }
  /* a picked image stages here (thumbnail + remove) and sends WITH the message, not on pick */
  #attach { display: flex; align-items: flex-start; gap: 6px; padding: 0 4px 8px; }
  #attach[hidden] { display: none; }
  #attach .thumbwrap { position: relative; }
  #attachImg { display: block; width: 64px; height: 64px; object-fit: cover; border-radius: 10px; }
  #attachX { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
             border-radius: 50%; background: #3a3a3f; color: var(--fg); font-size: 11px;
             line-height: 1; display: flex; align-items: center; justify-content: center; }
  #hint { display: none; margin-top: 5px; color: var(--muted); font-size: 11.5px; text-align: center; }
  #hint.show { display: block; }
  #hint.err { color: var(--red); }
  #composer.locked #input, #composer.locked #send { display: none; }
  #composer.locked #hint { display: block; color: var(--red); font-size: 13px; }

  /* ---- session details (click the thread's avatar/name) — Signal-style side panel ------------- */
  /* Slides in over the right edge of the thread pane, full height, the way Signal Desktop shows
     conversation details: no bottom-sheet chrome (the grab handle is hidden, an explicit ✕ shows),
     no backdrop dim, and Escape or an outside click closes it. */
  #sheetWrap { position: fixed; inset: 0; z-index: 30; background: transparent; display: none; }
  body.sheet-open #sheetWrap { display: block; }
  #sheet { position: absolute; right: 0; top: 0; bottom: 0; width: min(560px, 90vw);
           overflow-y: auto; overscroll-behavior: contain;
           background: #131316; border-left: .5px solid var(--row-sep);
           box-shadow: -18px 0 40px rgba(0,0,0,.45);
           padding: 14px 18px 16px;
           animation: sheetin .16s ease; }
  @keyframes sheetin { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  #sheet .grab { display: none; }
  .sheetclose { position: absolute; top: 12px; right: 14px; width: 28px; height: 28px;
                border-radius: 50%; background: var(--bubble); color: var(--dim);
                font-size: 13px; line-height: 1;
                display: flex; align-items: center; justify-content: center; }
  .sheetclose:hover { color: var(--fg); }
  #sheet .shead { display: flex; align-items: center; gap: 10px; margin: 2px 36px 10px 0; }
  #sheet .shead .avatar { flex: 0 0 40px; width: 40px; height: 40px; font-size: 16px; }
  #sheet .shead .sname { font-size: 18px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  #sheet .row { display: flex; gap: 12px; padding: 9px 0; border-bottom: .5px solid var(--row-sep);
                font-size: 14.5px; align-items: baseline; }
  #sheet .row:last-child { border-bottom: none; }
  #sheet .k { flex: 0 0 118px; color: var(--muted); }
  #sheet .v { flex: 1 1 auto; min-width: 0; word-break: break-word; }
  #sheet .v.mono { font: 12.5px/1.5 ui-monospace, Menlo, monospace; color: var(--dim); }
  #sheet .ctxbar { height: 6px; border-radius: 3px; background: #2c2c31; margin-top: 6px; overflow: hidden; }
  #sheet .ctxbar i { display: block; height: 100%; border-radius: 3px; background: var(--green); }
  #sheet .ctxbar i.warn { background: var(--amber); }
  #sheet .ctxbar i.hot { background: var(--red); }
  #sheet .chips { margin-top: 2px; }
  #sheetLoading { padding: 24px 0; color: var(--muted); text-align: center; }

  /* ---- token gate ------------------------------------------------------------------------------ */
  #gate { position: fixed; inset: 0; background: var(--bg); display: none;
          flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
  body.gated #gate { display: flex; }
  #gate .title { font-size: 22px; font-weight: 700; }
  #gate input { width: min(320px, 80vw); background: var(--bubble); border: none;
                color: var(--fg); border-radius: 12px; padding: 11px 14px; font: inherit; font-size: 16px; }
  #gate .msg { color: var(--muted); text-align: center; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <header id="listHeader">
    <input id="search" type="search" placeholder="Search" autocomplete="off" />
    <span class="live" id="liveDot" title="live stream"></span>
  </header>

  <div id="list"></div>
  <div id="listEmpty" hidden>loading…</div>

  <div id="askbar" hidden>
    <div class="to">To: <b>tx-assistant</b><span class="about" id="askAbout"></span></div>
    <div class="frow">
      <textarea id="askInput" rows="1" autocomplete="off" enterkeyhint="send" placeholder="Ask about the selected sessions"></textarea>
      <button id="askSend" disabled>↑</button>
    </div>
    <span id="askHint"></span>
  </div>

  <div id="thread" class="empty">
    <div id="threadEmpty">select a conversation</div>
    <div id="threadHead"></div>
    <div id="banner" hidden></div>
    <div id="turns"></div>
    <div id="composer">
      <div id="attach" hidden>
        <span class="thumbwrap"><img id="attachImg" alt="attachment" /><button id="attachX" title="remove">✕</button></span>
      </div>
      <div class="frow">
        <button id="plus" title="attach an image">+</button>
        <input id="file" type="file" accept="image/*" />
        <textarea id="input" rows="1" autocomplete="off" enterkeyhint="send" placeholder="Message"></textarea>
        <button id="send" disabled>↑</button>
      </div>
      <span id="hint"></span>
    </div>
  </div>
</div>

<div id="sheetWrap">
  <div id="sheet"></div>
</div>

<div id="gate">
  <span class="title">tx remote</span>
  <span class="msg">this server requires an access token<br />(TX_REMOTE_TOKEN on the host)</span>
  <input id="gateInput" type="password" placeholder="token" autocomplete="off" />
</div>

<script src="/shared.js"></script>
<script>
"use strict";
// The DESKTOP face: a persistent split-pane — list left, thread right, both always visible — so
// navigation is just repainting the selected row (no back button, no screen switch). Everything
// face-agnostic — state, stream, rendering helpers, the reply/attach/ask pipelines and their
// listeners — lives in shared.js (loaded above); this file renders the list and thread in the
// split-pane idiom and defines openThread() for shared code to navigate with.

// ---- list ----------------------------------------------------------------------------------------
function convHtml(item) {
  const chips = (item.tags || []).map((tag) => {
    const color = (item.tag_colors && item.tag_colors[tag]) || "var(--dim)";
    return `<span class="chip" style="--chip:${color}">${escapeHtml(tag)}</span>`;
  }).join("");
  const needs = item.reason === "blocked" || item.reason === "ready";
  const classes = `conv s-${item.state}${needs ? " needs" : ""}${item.id === sel ? " selected" : ""}${item.reason === "working" || item.reason === "idle" ? " dimmed" : ""}`;
  return `<button class="${classes}" data-id="${escapeHtml(item.id)}">` +
    `<span class="need ${needs ? item.reason : ""}"></span>` +
    `<span class="avatar">${escapeHtml(initial(item.name))}</span>` +
    `<span class="mid"><span class="nrow"><span class="cname">${escapeHtml(item.name)}</span>` +
    `<span class="ctime">${escapeHtml(item.rel || "")}</span></span>` +
    `<div class="cprev">${item.reason === "working" ? typingHtml("mini") : escapeHtml(stripMarkdown(item.preview || "—"))}</div>` +
    (chips ? `<div class="chips">${chips}</div>` : "") +
    `</span>` +
    `<span class="pickwrap"><span class="pick${picked.has(item.id) ? " on" : ""}">✓</span></span>` +
    `</button>`;
}

function render() {
  const empty = $("listEmpty");
  if (!feed) { empty.hidden = false; empty.textContent = "loading…"; return; }
  if (sel && !feed.items.some((item) => item.id === sel)) {
    sel = null;                                     // the open session exited — back to the empty state
  }
  const q = $("search").value.trim().toLowerCase();
  let rows = feed.items;
  if (q) {
    rows = rows
      .map((item) => ({ item, score: fuzzyScore(item, q) }))
      .filter((entry) => entry.score > 0)
      .sort((a, b) => b.score - a.score || b.item.last_ts - a.item.last_ts)
      .map((entry) => entry.item);
  }
  $("list").innerHTML = rows.map(convHtml).join("");
  empty.hidden = rows.length > 0;
  empty.textContent = feed.items.length === 0 ? "no live llm sessions" : "no matches";
  const needs = feed.items.filter((item) => item.reason === "blocked" || item.reason === "ready").length;
  document.title = needs ? `(${needs}) tx remote` : "tx remote";   // browser-tab badge only
  renderAskbar();
  renderThread();
}

function openThread(id) {
  if (id !== sel) { clearAttach(); resetOlder(); }   // staged image + paged history belong to their thread
  sel = id;
  render();                       // full render: the list repaints its selected-row highlight too
}

// ---- thread --------------------------------------------------------------------------------------
// Messenger layout: consecutive same-sender bubbles group (facing corners flatten, 1px apart);
// a centred time separator marks a >10 min gap instead of per-bubble stamps. #composer is static —
// only shown/hidden/relabeled — so a live repaint never clobbers typing.
function renderThread() {
  const item = feed && feed.items.find((candidate) => candidate.id === sel);
  $("thread").classList.toggle("empty", !item);
  if (!item) { shownFor = null; return; }

  $("threadHead").className = `s-${item.state}`;
  const pct = item.context_pct;
  const pctChip = pct == null ? "" :
    `<span class="ctxpct${pct > 80 ? " hot" : pct > 55 ? " warn" : ""}" title="context used">${pct}%</span>`;
  $("threadHead").innerHTML =
    `<span class="avatar">${escapeHtml(initial(item.name))}</span>` +
    `<span class="tname">${escapeHtml(item.name)}</span>${pctChip}`;

  const banner = $("banner");
  const answerable = item.reason === "blocked" && item.blocked && item.blocked.questions;
  if (item.reason === "blocked" && item.blocked && !answerable) {
    banner.hidden = false;
    banner.innerHTML = `⏸ blocked on <b>${escapeHtml(item.blocked.tool)}</b> ${escapeHtml(item.blocked.input || "")} — answer it in the terminal`;
  } else {
    banner.hidden = true;
  }

  const turns = $("turns");
  const wasAtBottom = turns.scrollHeight - turns.scrollTop - turns.clientHeight < 60;
  const msgs = (older.id === item.id ? older.turns : []).concat(item.turns);
  turns.innerHTML = msgs.map((turn, index) => {
    if (turn.who === "tools") return `<div class="turn tools">· ${turn.count} tool call${turn.count === 1 ? "" : "s"} ·</div>`;
    const prev = msgs[index - 1], next = msgs[index + 1];
    const sep = turn.ts && (!prev || !prev.ts || turn.ts - prev.ts > 600) ? timeSep(turn.ts) : "";
    const samePrev = prev && prev.who === turn.who && !sep;
    const sameNext = next && next.who === turn.who && !(next.ts && turn.ts && next.ts - turn.ts > 600);
    const pos = samePrev && sameNext ? "mid" : samePrev ? "bot" : sameNext ? "top" : "solo";
    const text = renderImages(turn.who === "agent" ? renderMarkdown(turn.text) : renderAboutTags(escapeHtml(turn.text)));
    return `${sep}<div class="turn ${turn.who} g-${pos}">${text}</div>`;
  }).join("") || `<div class="turn tools">no dialogue yet</div>`;
  // A WORKING session shows the classic typing bubble instead of any text hint.
  if (item.reason === "working") turns.insertAdjacentHTML("beforeend", typingHtml(""));
  // An answerable AskUserQuestion renders as an in-thread option card — click to answer the dialog.
  if (answerable) {
    const q = item.blocked.questions[0];
    turns.insertAdjacentHTML("beforeend",
      `<div class="qcard" data-tuid="${escapeHtml(item.blocked.tool_use_id || "")}">` +
      `<div class="qtext">${escapeHtml(q.question)}</div>` +
      q.options.map((o, i) =>
        `<button class="qopt" data-opt="${i + 1}"><span class="qlabel">${escapeHtml(o.label)}</span>` +
        (o.description ? `<span class="qdesc">${escapeHtml(o.description)}</span>` : "") + `</button>`
      ).join("") +
      `<span class="qhint">clicking answers the dialog in the session</span></div>`);
  }
  if (older.id === item.id && !older.more) {
    turns.insertAdjacentHTML("afterbegin", `<div class="turn tools">· beginning of loaded history ·</div>`);
  }
  if (shownFor !== item.id || wasAtBottom) turns.scrollTop = turns.scrollHeight;
  shownFor = item.id;

  const composer = $("composer"), hint = $("hint");
  composer.classList.toggle("locked", item.reason === "blocked");
  if (item.reason === "blocked") {
    hint.className = "show";
    hint.textContent = answerable
      ? "answer by clicking an option above"
      : "a dialog is up in the terminal — text can't answer it";
  } else {
    hint.className = "";                            // hidden: the common case carries no chrome
    hint.textContent = "";
  }
}

// ---- face events ---------------------------------------------------------------------------------
$("threadHead").addEventListener("click", (event) => {
  // The avatar, the name, or the context chip opens the session-details sheet.
  if (sel && (event.target.closest(".avatar") || event.target.closest(".tname") || event.target.closest(".ctxpct"))) openSheet(sel);
});

boot();
</script>
</body>
</html>
