      '</tr></thead><tbody>' + derivedRows + "</tbody></table></section>" : "") +

    (d.notes.length ? '<section><h2>Notes · ' + d.notes.length + "</h2>" + notes + "</section>" : "") +

    '<section><h2>Conversation</h2><div id="conv"><div id="convLoad">loading full history…</div></div></section>';

  return loadConversation(id, d);
}

async function loadConversation(id, detail) {
  const conv = document.getElementById("conv");
  let data;
  try { data = await getJSON("/api/chats/" + encodeURIComponent(id) + "/dialogue"); }
  catch (e) { conv.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }
  if (location.hash !== "#/chats/" + id) return;   // user navigated away meanwhile
  const parts = [];
  data.chats.forEach((chat, index) => {
    const label = detail.chats[index] || {};
    parts.push('<div class="chat-sep"><b>chat ' + (index + 1) + "</b>" +
      '<span>' + esc(chat.role) + "</span>" +
      (chat.id ? '<span title="' + esc(chat.id) + '">' + esc(shortId(chat.id)) + "</span>" : "") +
      (label.started_ago ? "<span>started " + esc(label.started_ago) + " ago</span>" : "") +
      (chat.source ? "<span>source: " + esc(chat.source) + "</span>" : "") +
      "<span>" + chat.turns.length + " turns</span></div>");
    if (!chat.source) {
      parts.push('<div class="muted" style="padding:10px 0">no transcript on disk for this chat.</div>');
      return;
    }
    for (const turn of chat.turns) {
      if (turn.who === "tools") {
        const names = (turn.names || []).slice(0, 4).join(", ");
        parts.push('<div class="turn tools">· ' + turn.count + " tool call" + (turn.count === 1 ? "" : "s") +
                   (names ? " — " + esc(names) : "") + " ·</div>");
      } else if (turn.who === "you") {
        parts.push('<div class="turn you"><span class="who">you</span><span class="ts">' + fmtTs(turn.ts) +
                   '</span><div class="body">' + esc(turn.text) + "</div></div>");
      } else {
        parts.push('<div class="turn agent"><span class="who">agent</span><span class="ts">' + fmtTs(turn.ts) +
                   '</span><div class="body md">' + renderMarkdown(turn.text) + "</div></div>");
      }
    }
  });
  conv.innerHTML = parts.join("") || '<div class="muted">no conversation recorded.</div>';
}

// ---- artifact reader ----
// One persistent panel replacing the old list page + detail page: an index rail (banded by effort
// group), the document, and a rail that switches between the document's OUTLINE and its REVISIONS.
// Picking an artifact swaps the centre only — never a page navigation — so a set of plans can be
// skimmed at keyboard speed. The whole reading position rides in the hash and deep-links:
//   #/artifacts            the reader, nothing open
//   #/artifacts/<id>       the working copy
//   #/artifacts/<id>@7     the frozen rev 7
//   #/artifacts/<id>@5..7  rev 5 → rev 7, diffed
const AV = {
  index: null, detail: null, id: null,
  rev: null,             // null = the working copy; N = reading that frozen snapshot
  cmp: null,             // {a, b} = diffing two snapshots
  text: new Map(),       // "<id>@<rev>" -> text; a rev is immutable, so this never goes stale
  filter: "", find: "", findAt: 0, finding: false, fullDiff: false,
};
try { AV.rail = localStorage.getItem("txide-av-rail") || "outline"; } catch (e) { AV.rail = "outline"; }
try { AV.norail = localStorage.getItem("txide-av-norail") === "1"; } catch (e) { AV.norail = false; }
try { AV.noindex = localStorage.getItem("txide-av-noindex") === "1"; } catch (e) { AV.noindex = false; }
try { AV.sbs = localStorage.getItem("txide-av-sbs") === "1"; } catch (e) { AV.sbs = false; }
function avSave() {
  try {
    localStorage.setItem("txide-av-rail", AV.rail);
    localStorage.setItem("txide-av-norail", AV.norail ? "1" : "0");
    localStorage.setItem("txide-av-noindex", AV.noindex ? "1" : "0");
    localStorage.setItem("txide-av-sbs", AV.sbs ? "1" : "0");
  } catch (e) {}
}
function avEl(id) { return document.getElementById(id); }
function avRawUrl(id, rev) {
  return "/api/artifacts/" + encodeURIComponent(id) + "/raw" + (rev == null ? "" : "?rev=" + rev);
}
function avKind(filename) {
  const ext = filename.includes(".") ? filename.split(".").pop().toLowerCase() : "";
  return ({ markdown: "md", patch: "diff", yml: "yaml", text: "txt" })[ext] || ext || "raw";
}

// The hash carries the reading position; these two are its only parser and only writer.
function avParse(rest) {
  const at = rest.indexOf("@");
  if (at < 0) return { id: rest, rev: null, cmp: null };
  const id = rest.slice(0, at), spec = rest.slice(at + 1);
  const range = spec.match(/^(\d+)\.\.(\d+)$/);
  if (range) return { id, rev: null, cmp: { a: +range[1], b: +range[2] } };
  return { id, rev: /^\d+$/.test(spec) ? +spec : null, cmp: null };
}
function avGo(id, rev, cmp) {
  if (!id) { location.hash = "/artifacts"; return; }
  location.hash = "/artifacts/" + id +
    (cmp ? "@" + cmp.a + ".." + cmp.b : rev != null ? "@" + rev : "");
}

// One function per content kind — the seam every future format drops into. A new format is a `kind`
// from the server's classifier plus a renderer here; nothing else in the reader moves.
const AV_VIEWERS = {
  markdown: v => '<div class="md">' + renderMarkdown(v.text) + "</div>",
  text: v => '<pre class="raw">' + esc(v.text) + "</pre>",
  binary: v => '<p class="muted">Binary content · ' + fmtBytes(v.size) + "</p>" +
    '<a class="dl" href="' + avRawUrl(v.id, v.rev) + '">↓ download ' + esc(v.filename) + "</a>",
};
function avViewerHtml(view) { return (AV_VIEWERS[view.encoding] || AV_VIEWERS.binary)(view); }

async function renderArtifactReader(rest) {
  setNav("artifacts", false);
  const want = rest ? avParse(rest) : { id: null, rev: null, cmp: null };
  const sameView = want.id === AV.id && want.rev === AV.rev &&
    JSON.stringify(want.cmp) === JSON.stringify(AV.cmp);
  if (want.id !== AV.id) { AV.find = ""; AV.findAt = 0; AV.finding = false; }
  AV.id = want.id; AV.rev = want.rev; AV.cmp = want.cmp;
  avShell();
  const list = avEl("av-ilist"), body = avEl("av-dbody");
  const listTop = list.scrollTop, bodyTop = sameView ? body.scrollTop : 0;
  try { AV.index = await getJSON("/api/artifacts"); }
  catch (e) { list.innerHTML = '<div class="err" style="padding:16px">' + esc(e.message) + "</div>"; return; }
  avRenderIndex();
  list.scrollTop = listTop;
  if (!AV.id) {
    avEl("av-dhead").innerHTML = '<span class="ti muted">no artifact open</span>';
    body.innerHTML = '<div class="av-page"><div class="empty">' +
      (AV.index.artifacts.length
        ? "Pick an artifact on the left, or press <b>j</b>/<b>k</b> to walk the list."
        : "No artifacts yet. Create one with <code>tx artifact create &lt;file&gt;</code>.") +
      "</div></div>";
    avEl("av-rbody").innerHTML = "";
    return;
  }
  try { AV.detail = await getJSON("/api/artifacts/" + encodeURIComponent(AV.id)); }
  catch (e) {
    avEl("av-dhead").innerHTML = '<span class="ti muted">not found</span>';
    body.innerHTML = '<div class="av-page"><div class="err">' + esc(e.message) + "</div></div>";
    return;
  }
  document.title = "tx-ide — " + (AV.detail.title || AV.detail.filename);
  await avRenderDoc();
  avEl("av-dbody").scrollTop = bodyTop;
}

// The shell is built once and then only its three bodies are re-filled, so the index rail keeps its
// scroll across the refresh tick. Leaving the view and coming back rebuilds it.
function avShell() {
  if (avEl("av-wrap")) { avSyncChrome(); return; }
  filterables = [];
  app.innerHTML =
    '<div class="av-wrap" id="av-wrap">' +
      '<div class="av-index">' +
        '<div class="av-ifilter"><input id="av-filter" type="search" placeholder="filter artifacts…" autocomplete="off"></div>' +
        '<div class="av-ilist" id="av-ilist"></div>' +
      '</div>' +
      '<div class="av-doc" id="av-doc">' +
        '<div class="av-dhead" id="av-dhead"></div>' +
        '<div class="av-find" id="av-findbar">' +
          '<input id="av-findinput" type="text" placeholder="find in document…" autocomplete="off">' +
          '<span class="n" id="av-findn"></span>' +
          '<button class="av-btn" id="av-findprev" title="previous (shift-enter)">↑</button>' +
          '<button class="av-btn" id="av-findnext" title="next (enter)">↓</button>' +
          '<button class="av-btn" id="av-findclose" title="close (esc)">✕</button>' +
        '</div>' +
        '<div class="av-body" id="av-dbody"></div>' +
      '</div>' +
      '<div class="av-rail" id="av-rail">' +
        '<div class="av-rtabs">' +
          '<div class="av-rtab" data-tab="outline">outline</div>' +
          '<div class="av-rtab" data-tab="revs">revisions</div>' +
        '</div>' +
        '<div class="av-rbody" id="av-rbody"></div>' +
      '</div>' +
    '</div>';
  avEl("av-filter").value = AV.filter;
  avEl("av-filter").oninput = e => { AV.filter = e.target.value; avRenderIndex(); };
  avEl("av-ilist").onclick = e => {
    const row = e.target.closest(".av-row");
    if (row) avGo(row.dataset.id, null, null);
  };
  document.querySelectorAll(".av-rtab").forEach(tab => {
    tab.onclick = () => { AV.rail = tab.dataset.tab; AV.norail = false; avSave(); avSyncChrome(); avRenderRail(); };
  });
  avEl("av-dbody").addEventListener("scroll", avSpy, { passive: true });
  avEl("av-findinput").oninput = e => { AV.find = e.target.value; AV.findAt = 0; avApplyFind(true); };
  avEl("av-findinput").onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); avFindStep(e.shiftKey ? -1 : 1); }
    else if (e.key === "Escape") { e.preventDefault(); avCloseFind(); }
  };
  avEl("av-findnext").onclick = () => avFindStep(1);
  avEl("av-findprev").onclick = () => avFindStep(-1);
  avEl("av-findclose").onclick = avCloseFind;
  avSyncChrome();
}
function avSyncChrome() {
  avEl("av-wrap").classList.toggle("norail", AV.norail);
  avEl("av-wrap").classList.toggle("noindex", AV.noindex);
  avEl("av-doc").classList.toggle("finding", AV.finding);
  document.querySelectorAll(".av-rtab").forEach(t => t.classList.toggle("on", t.dataset.tab === AV.rail));
}

function avRenderIndex() {
  const needle = AV.filter.trim().toLowerCase();
  const matches = AV.index.artifacts.filter(a => !needle ||
    (a.title || "").toLowerCase().includes(needle) ||
    a.filename.toLowerCase().includes(needle) ||
    (a.resolved_group || "").toLowerCase().includes(needle) ||
    a.authors.some(author => author.name.toLowerCase().includes(needle)));
  // Band by effort group while KEEPING the payload's newest-touched-first order: a group takes the
  // position of its freshest artifact, so recent work still floats to the top of the rail.
  const groups = [], byGroup = new Map();
  for (const artifact of matches) {
    const group = artifact.resolved_group || "—";
    if (!byGroup.has(group)) { byGroup.set(group, []); groups.push(group); }
    byGroup.get(group).push(artifact);
  }
  avEl("av-ilist").innerHTML = groups.map(group => {
    const items = byGroup.get(group);
    return '<div class="av-gband" style="--c:' + esc(items[0].group_color || "var(--dim)") + '">' +
      esc(group) + "</div>" +
      items.map(a =>
        '<div class="av-row' + (a.id === AV.id ? " sel" : "") + '" data-id="' + esc(a.id) + '">' +
          '<span class="t" title="' + esc(a.title || a.filename) + '">' + esc(a.title || a.filename) + "</span>" +
          '<span class="m"><span class="av-kind">' + esc(avKind(a.filename)) + "</span>" +
          a.revs + "r · " + esc(a.updated_ago) + "</span>" +
        "</div>").join("");
  }).join("") || '<div class="empty" style="padding:44px 12px;font-size:12.5px">no match</div>';
}

// ---- the document pane: working copy | a frozen rev | a diff ----
async function avRenderDoc() {
  const detail = AV.detail, body = avEl("av-dbody");
  avSyncHead();
  body.innerHTML = '<div class="av-page"><div class="muted">loading…</div></div>';
  if (AV.cmp) await avRenderDiff();
  else if (AV.rev != null) await avRenderRev();
  else body.innerHTML = '<div class="av-page">' + avViewerHtml({
    ...detail.working, id: detail.id, rev: null, filename: detail.filename,
  }) + "</div>";
  // Re-marking after a re-render must NOT jump the viewport — the 5s refresh tick lands here, and
  // scrolling the reader back to the current hit every minute would fight whoever is reading.
  avApplyFind(false);
  avRenderRail();
}

// The header is re-rendered on its own for layout toggles — collapsing a rail must not cost a
// re-render of the document (or a re-fetch of the revs behind a diff).
function avSyncHead() {
  avEl("av-dhead").innerHTML = avHeadHtml(AV.detail);
  avEl("av-findbtn").onclick = () => (AV.finding ? avCloseFind() : avOpenFind());
  avEl("av-indexbtn").onclick = () => { AV.noindex = !AV.noindex; avSave(); avSyncChrome(); avSyncHead(); };
  avEl("av-railbtn").onclick = () => {
    AV.norail = !AV.norail; avSave(); avSyncChrome(); avSyncHead(); avRenderRail();
  };
  if (AV.rev != null || AV.cmp) avEl("av-current").onclick = () => avGo(AV.id, null, null);
  if (!AV.cmp) return;
  avEl("av-sbs").onclick = event => {
    const pick = event.target.closest("[data-sbs]");
    if (!pick || AV.sbs === (pick.dataset.sbs === "1")) return;
    AV.sbs = pick.dataset.sbs === "1";
    // Side-by-side halves the measure, so it takes the rail's width — visibly, and undoably with
    // the rail button. Leaving side-by-side hands back whatever the rail was doing before.
    if (AV.sbs) { AV.railBeforeSbs = AV.norail; AV.norail = true; }
    else if (AV.railBeforeSbs !== undefined) { AV.norail = AV.railBeforeSbs; AV.railBeforeSbs = undefined; }
    avSave(); avSyncChrome(); avRenderRail(); avRenderDoc();
  };
  avEl("av-full").onclick = event => {
    const pick = event.target.closest("[data-full]");
    if (!pick || AV.fullDiff === (pick.dataset.full === "1")) return;
    AV.fullDiff = pick.dataset.full === "1";
    avRenderDoc();
  };
}

function avHeadHtml(detail) {
  return '<span class="ti" title="' + esc(detail.title || detail.filename) + '">' +
      esc(detail.title || detail.filename) + "</span>" +
    groupChip(detail) +
    (detail.dirty ? '<span class="badge" title="the working copy has edits no rev has captured yet">dirty</span>' : "") +
    '<span class="sub">' + esc(detail.filename) + " · " + detail.revs + "r · " +
      fmtBytes(detail.working.size) + "</span>" +
    '<span class="av-acts">' +
      (AV.rev != null || AV.cmp
        ? '<button class="av-btn on" id="av-current" title="back to the working copy">' +
          (AV.cmp ? "rev " + AV.cmp.a + " → " + AV.cmp.b : "reading rev " + AV.rev) + " ✕</button>"
        : "") +
      (AV.cmp ? avSegHtml("av-sbs", "sbs", AV.sbs, "unified", "side-by-side", "how to lay the diff out") +
        avSegHtml("av-full", "full", AV.fullDiff, "changes", "whole doc",
                  "just the changed regions with context, or every line of the document") : "") +
      '<button class="av-btn" id="av-findbtn" title="find in document  ( / )">find</button>' +
      '<button class="av-btn" id="av-indexbtn" title="show / hide the artifact index">' +
        (AV.noindex ? "index ▸" : "◂ index") + "</button>" +
      '<button class="av-btn" id="av-railbtn" title="show / hide the outline / revisions rail">' +
        (AV.norail ? "◂ rail" : "rail ▸") + "</button>" +
      '<a class="av-btn" href="' + avRawUrl(detail.id, AV.rev) + '" title="download these bytes">↓</a>' +
    "</span>";
}

// `off`/`on` are the two labels; `state` picks which is lit. The chosen value comes back as the
// data attribute `key`, so one delegated handler per control reads it.
function avSegHtml(id, key, state, off, on, title) {
  const seg = (label, value, lit) =>
    "<span data-" + key + '="' + value + '"' + (lit ? ' class="on"' : "") + ">" + label + "</span>";
  return '<span class="av-seg" id="' + id + '" title="' + esc(title) + '">' +
    seg(off, 0, !state) + seg(on, 1, state) + "</span>";
}

async function avRevText(rev) {
  const key = AV.id + "@" + rev;
  if (AV.text.has(key)) return AV.text.get(key);
  const response = await fetch(avRawUrl(AV.id, rev));
  if (!response.ok) throw new Error("rev " + rev + ": HTTP " + response.status);
  const text = await response.text();
  AV.text.set(key, text);
  return text;
}

async function avRenderRev() {
  const detail = AV.detail, body = avEl("av-dbody");
  if (detail.working.encoding === "binary") {
    body.innerHTML = '<div class="av-page">' + avViewerHtml({
      ...detail.working, id: detail.id, rev: AV.rev, filename: detail.filename }) + "</div>";
    return;
  }
  let text;
  try { text = await avRevText(AV.rev); }
  catch (e) { body.innerHTML = '<div class="av-page"><div class="err">' + esc(e.message) + "</div></div>"; return; }
  if (AV.rev == null || AV.cmp) return;   // navigated away while the rev was in flight
  body.innerHTML = '<div class="av-page">' + avViewerHtml({
    encoding: detail.working.encoding, text, size: text.length,
    id: detail.id, rev: AV.rev, filename: detail.filename,
  }) + "</div>";
}

async function avRenderDiff() {
  const body = avEl("av-dbody");
  let left, right;
  try { [left, right] = await Promise.all([avRevText(AV.cmp.a), avRevText(AV.cmp.b)]); }
  catch (e) { body.innerHTML = '<div class="av-page"><div class="err">' + esc(e.message) + "</div></div>"; return; }
  if (!AV.cmp) return;   // navigated away while the revs were in flight
  const rows = avPairRows(avLineDiff(left, right));
  const changed = rows.filter(row => row.kind !== "eq").length;
  const shown = AV.fullDiff ? rows : avCollapse(rows);
  const head = '<p class="muted" style="margin:0 0 14px;font:12px var(--mono)">rev ' + AV.cmp.a +
    " → rev " + AV.cmp.b + " · " + (changed ? changed + " changed line" + (changed === 1 ? "" : "s") : "identical") + "</p>";
  body.innerHTML = '<div class="av-page' + (AV.sbs ? " wide-page" : "") + '">' + head +
    (AV.sbs ? avSbsHtml(shown) : avUnifiedHtml(shown)) + "</div>";
}

// A line diff by LCS. We store whole versions, not deltas, so the comparison is computed here — one
// op list, rendered two ways. The common prefix/suffix is trimmed first: these are long plans whose
// revs mostly match, and the O(n·m) table then only has to cover what actually moved.
function avLineDiff(left, right) {
  const a = left.split("\n"), b = right.split("\n");
  let head = 0;
  while (head < a.length && head < b.length && a[head] === b[head]) head++;
  let tail = 0;
  while (tail < a.length - head && tail < b.length - head &&
         a[a.length - 1 - tail] === b[b.length - 1 - tail]) tail++;
  const am = a.slice(head, a.length - tail), bm = b.slice(head, b.length - tail);
  const n = am.length, m = bm.length;
  const lcs = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      lcs[i][j] = am[i] === bm[j] ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
    }
  }
  const ops = [];
  for (let k = 0; k < head; k++) ops.push({ op: "=", text: a[k], la: k + 1, lb: k + 1 });
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (am[i] === bm[j]) ops.push({ op: "=", text: am[i], la: head + i++ + 1, lb: head + j++ + 1 });
    else if (lcs[i + 1][j] >= lcs[i][j + 1]) ops.push({ op: "-", text: am[i], la: head + i++ + 1, lb: null });
    else ops.push({ op: "+", text: bm[j], la: null, lb: head + j++ + 1 });
  }
  while (i < n) ops.push({ op: "-", text: am[i], la: head + i++ + 1, lb: null });
  while (j < m) ops.push({ op: "+", text: bm[j], la: null, lb: head + j++ + 1 });
  for (let k = 0; k < tail; k++) {
    ops.push({ op: "=", text: a[a.length - tail + k], la: a.length - tail + k + 1, lb: b.length - tail + k + 1 });
  }
  return ops;
}

// Pair each run of deletions with the run of additions that follows it, so a rewritten line shows as
// ONE changed row with both sides — the shape both renderings want.
function avPairRows(ops) {
  const rows = [];
  let i = 0;
  while (i < ops.length) {
    if (ops[i].op === "=") { rows.push({ kind: "eq", left: ops[i], right: ops[i] }); i++; continue; }
    const dels = [], adds = [];
    while (i < ops.length && ops[i].op === "-") dels.push(ops[i++]);
    while (i < ops.length && ops[i].op === "+") adds.push(ops[i++]);
    for (let k = 0; k < Math.max(dels.length, adds.length); k++) {
      const left = dels[k] || null, right = adds[k] || null;
      rows.push({ kind: left && right ? "chg" : left ? "del" : "add", left, right });
    }
  }
  return rows;
}

const AV_CONTEXT = 3;
function avCollapse(rows) {
  const keep = rows.map(() => false);
  rows.forEach((row, k) => {
    if (row.kind === "eq") return;
    for (let x = Math.max(0, k - AV_CONTEXT); x <= Math.min(rows.length - 1, k + AV_CONTEXT); x++) keep[x] = true;
  });
  const out = [];
  let hidden = 0;
  rows.forEach((row, k) => {
    if (!keep[k]) { hidden++; return; }
    if (hidden) { out.push({ kind: "skip", n: hidden }); hidden = 0; }
    out.push(row);
  });
  if (hidden) out.push({ kind: "skip", n: hidden });
  return out;
}
function avSkipLabel(row) {
  return "⋯ " + row.n + " unchanged line" + (row.n === 1 ? "" : "s");
}

function avUnifiedHtml(rows) {
  const lines = [];
  for (const row of rows) {
    if (row.kind === "skip") { lines.push('<span class="s">' + esc(avSkipLabel(row)) + "</span>"); continue; }
    if (row.kind === "eq") { lines.push('<span class="c"> ' + esc(row.left.text) + "</span>"); continue; }
    if (row.left) lines.push('<span class="d">-' + esc(row.left.text) + "</span>");
    if (row.right) lines.push('<span class="a">+' + esc(row.right.text) + "</span>");
  }
  // Each span is its own block (wrapped lines get a hanging indent), so the spans butt together —
  // a newline between them would render as an extra blank line inside the <pre>.
  return '<pre class="diff">' + lines.join("") + "</pre>";
}

function avSbsHtml(rows) {
  // An explicit colgroup, because `table-layout: fixed` takes its widths from the FIRST row — and
  // that row is often a colspan-4 "N unchanged lines" marker, which would leave all four columns
  // to split evenly and strand the text in quarter-width gutters.
  return '<table class="av-sbs"><colgroup><col class="cn"><col><col class="cn"><col></colgroup>' +
    rows.map(row => {
    if (row.kind === "skip") return '<tr class="skip"><td colspan="4">' + esc(avSkipLabel(row)) + "</td></tr>";
    const left = '<td class="ln">' + (row.left ? row.left.la : "") + '</td><td class="lt">' +
      (row.left ? esc(row.left.text) : "") + "</td>";
    const right = '<td class="ln gut">' + (row.right ? row.right.lb : "") + '</td><td class="rt">' +
      (row.right ? esc(row.right.text) : "") + "</td>";
    return '<tr class="' + row.kind + '">' + left + right + "</tr>";
  }).join("") + "</table>";
}

// ---- the rail: outline | revisions ----
function avRenderRail() {
  if (AV.norail) return;
  if (AV.rail === "revs") avRenderRevs(); else avRenderOutline();
}

// Headings lifted out of the RENDERED document, so it works for any viewer that emits them and
// needs no second parse of the source.
function avRenderOutline() {
  const body = avEl("av-dbody");
  const headings = Array.from(body.querySelectorAll("h1, h2, h3, h4"));
  headings.forEach((heading, k) => { heading.id = "av-h" + k; });
  avEl("av-rbody").innerHTML = headings.length
    ? '<div class="av-toc">' + headings.map((heading, k) =>
        '<a href="#" data-h="' + k + '" class="l' + heading.tagName[1] + '" title="' +
        esc(heading.textContent) + '">' + esc(heading.textContent) + "</a>").join("") + "</div>"
    : '<div class="av-rhint">This document has no headings to outline.</div>';
  avEl("av-rbody").onclick = event => {
    const link = event.target.closest("a[data-h]");
    if (!link) return;
    event.preventDefault();
    headings[+link.dataset.h].scrollIntoView({ block: "start", behavior: "smooth" });
  };
  avSpy();
}
// Scroll-spy: the last heading at or above the top of the viewport is the one you are reading.
function avSpy() {
  const toc = document.querySelector(".av-toc");
  if (!toc) return;
  const body = avEl("av-dbody"), links = Array.from(toc.children);
  let active = 0;
  links.forEach((link, k) => {
    const heading = avEl("av-h" + k);
    if (heading && heading.getBoundingClientRect().top - body.getBoundingClientRect().top < 60) active = k;
  });
  links.forEach((link, k) => link.classList.toggle("on", k === active));
}

function avRenderRevs() {
  const detail = AV.detail;
  const hint = '<div class="av-rhint">Click a revision to read it · <b>shift-click</b> a second to diff the two</div>';
  // The working copy is its own row above the history, because it is its own thing: normally equal
  // to the last rev, but when dirty it is content no revision holds. Reading "current" selects it.
  const working = '<div class="av-rev' + (AV.rev == null && !AV.cmp ? " on" : "") + '" data-rev="current">' +
    '<div><div class="r">now</div></div><div><div class="who">working copy</div>' +
    '<div class="ch">' + (detail.dirty
      ? "edits beyond rev " + (detail.revs - 1) + ", not yet snapshotted"
      : "identical to rev " + (detail.revs - 1)) + "</div></div></div>";
  // Newest first. A long history is usually one session hammering away, so the author is printed
  // only where it CHANGES — the rail then reads as "who took over when" instead of a repeated name.
  const newestFirst = detail.history.slice().reverse();
  const rows = newestFirst.map((touch, k) => {
    const selected = AV.rev === touch.rev || (AV.cmp && AV.cmp.b === touch.rev);
    const compared = AV.cmp && AV.cmp.a === touch.rev;
    const previous = newestFirst[k - 1];
    const handover = !previous || previous.session_id !== touch.session_id;
    return '<div class="av-rev' + (selected ? " on" : compared ? " cmp" : "") + '" data-rev="' + touch.rev + '">' +
      '<div><div class="r">r' + touch.rev + '</div><div class="ago">' + esc(touch.ago) + "</div></div>" +
      "<div>" +
      (handover ? '<div class="who" title="' + esc(touch.session_id) + '">' + esc(touch.actor) + "</div>" : "") +
      (touch.changes ? '<div class="ch">' + esc(touch.changes) + "</div>" : "") + "</div></div>";
  }).join("");
  avEl("av-rbody").innerHTML = hint + working + rows;
  avEl("av-rbody").onclick = event => {
    const row = event.target.closest(".av-rev");
    if (!row) return;
    const last = AV.detail.revs - 1;
    // The working-copy row has no rev of its own; for a comparison it stands in as the last one.
    const rev = row.dataset.rev === "current" ? last : +row.dataset.rev;
    // shift-click anchors the OTHER end of a comparison against whatever is currently open.
    if (event.shiftKey) {
      const anchor = AV.cmp ? AV.cmp.b : AV.rev != null ? AV.rev : last;
      if (anchor === rev) return;
      avGo(AV.id, null, { a: Math.min(anchor, rev), b: Math.max(anchor, rev) });
      return;
    }
    // Clicking the newest rev on a clean artifact is the working copy — same bytes, simpler hash.
    avGo(AV.id, row.dataset.rev !== "current" && !(rev === last && !AV.detail.dirty) ? rev : null, null);
  };
}

// ---- find in document ----
function avOpenFind() {
  AV.finding = true;
  avSyncChrome();
  const input = avEl("av-findinput");
  input.value = AV.find;
  input.focus();
  input.select();
}
function avCloseFind() {
  AV.finding = false; AV.find = ""; AV.findAt = 0;
  avSyncChrome();
  avApplyFind(false);
}
function avApplyFind(scroll) {
  const body = avEl("av-dbody");
  body.querySelectorAll("mark.av-hit").forEach(hit => hit.replaceWith(document.createTextNode(hit.textContent)));
  body.normalize();
  const needle = AV.find.trim().toLowerCase();
  if (needle.length < 2) { avEl("av-findn").textContent = needle ? "type more" : ""; return; }
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  const targets = [];
  while (walker.nextNode()) {
    if (walker.currentNode.nodeValue.toLowerCase().includes(needle)) targets.push(walker.currentNode);
  }
  for (const node of targets) avMarkNode(node, needle);
  avFindStep(0, scroll);
}
function avMarkNode(node, needle) {
  const text = node.nodeValue, lower = text.toLowerCase();
  const fragment = document.createDocumentFragment();
  let at = 0, found = lower.indexOf(needle);
  while (found >= 0) {
    if (found > at) fragment.appendChild(document.createTextNode(text.slice(at, found)));
    const mark = document.createElement("mark");
    mark.className = "av-hit";
    mark.textContent = text.slice(found, found + needle.length);
    fragment.appendChild(mark);
    at = found + needle.length;
    found = lower.indexOf(needle, at);
  }
  if (at < text.length) fragment.appendChild(document.createTextNode(text.slice(at)));
  node.replaceWith(fragment);
}
function avFindStep(delta, scroll = true) {
  const hits = Array.from(avEl("av-dbody").querySelectorAll("mark.av-hit"));
  if (!hits.length) { avEl("av-findn").textContent = "no match"; return; }
  AV.findAt = (AV.findAt + delta + hits.length) % hits.length;
  hits.forEach((hit, k) => hit.classList.toggle("cur", k === AV.findAt));
  if (scroll) hits[AV.findAt].scrollIntoView({ block: "center" });
  avEl("av-findn").textContent = AV.findAt + 1 + "/" + hits.length;
}

// ---- keyboard: walk the index, scrub revisions, find ----
document.addEventListener("keydown", event => {
  if (!avEl("av-wrap") || event.metaKey || event.ctrlKey || event.altKey) return;
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName);
  if (event.key === "/" && !inField) { event.preventDefault(); avOpenFind(); return; }
  if (event.key === "Escape" && AV.finding) { event.preventDefault(); avCloseFind(); return; }
  if (inField) return;
  if (event.key === "n" || event.key === "N") {
    if (!AV.find) return;
    event.preventDefault(); avFindStep(event.key === "n" ? 1 : -1); return;
  }
  if (event.key === "j" || event.key === "k" || event.key === "ArrowDown" || event.key === "ArrowUp") {
    const rows = Array.from(document.querySelectorAll(".av-row"));
    if (!rows.length) return;
    event.preventDefault();
    const at = rows.findIndex(row => row.dataset.id === AV.id);
    const step = event.key === "j" || event.key === "ArrowDown" ? 1 : -1;
    const next = rows[Math.min(rows.length - 1, Math.max(0, (at < 0 ? (step > 0 ? -1 : rows.length) : at) + step))];
    next.scrollIntoView({ block: "nearest" });
    avGo(next.dataset.id, null, null);
    return;
  }
  if ((event.key === "[" || event.key === "]") && AV.detail) {
    event.preventDefault();
    const last = AV.detail.revs - 1;
    const at = AV.cmp ? AV.cmp.b : AV.rev == null ? last : AV.rev;
    const next = Math.min(last, Math.max(0, at + (event.key === "]" ? 1 : -1)));
    avGo(AV.id, next === last && !AV.detail.dirty ? null : next, null);
  }
});


// ---- timeline view ----
// Swimlanes over /api/timeline. All wall-clock rendering is CLIENT-side and local-timezone: the
// payload is clock-free (fingerprint-stable while the store is quiet), the now-line runs on a 1s
// timer, and the refresh tick re-renders only when the data actually changed. View state (zoom,
// scroll, pinned tip) lives in TL and survives those re-renders.
const TL = { pph: null, sl: 0, st: 0, dragging: false, pinId: null, pinAt: null, fitted: false, follow: false, edit: false, sel: new Set(), drawer: { sid: null, t: null, filter: "", draft: "", stick: true, top: 0 } };
try { TL.activeOnly = localStorage.getItem("txide-tl-active-only") === "1"; } catch (e) { TL.activeOnly = false; }
try { TL.showSys = localStorage.getItem("txide-tl-show-sys") === "1"; } catch (e) { TL.showSys = false; }
try { TL.showU = localStorage.getItem("txide-tl-show-u") !== "0"; TL.showM = localStorage.getItem("txide-tl-show-m") !== "0"; TL.showE = localStorage.getItem("txide-tl-show-e") !== "0"; TL.showB = localStorage.getItem("txide-tl-show-b") !== "0"; } catch (e) { TL.showU = TL.showM = TL.showE = TL.showB = true; }
const TL_PADL = 14, TL_PADR = 46, TL_AXH = 46, TL_LANE = 30, TL_GH = 22, TL_GGAP = 12, TL_PADB = 14;
const TL_NOWPAD = 48;   // px of future visible right of the now line — the horizontal scroll clamp
const TL_WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
let tlData = null, tlTips = [], tlVisKey = "", tlClockTimer = null, tlDayLabelEls = [], tlRowYs = {}, tlBands = [], tlDragGroup = null, tlSuppressClick = false;

function tlActive() { const h = location.hash.replace(/^#/, ""); return h === "/timeline" || h.startsWith("/timeline/"); }
function tlNow() { return (Date.now() - tlData.epoch_ms) / 60000; }
function tlEnd() { return Math.max(tlData.t1, tlNow()) + 10; }
function tlMaxScroll(sc) { return Math.max(0, tlX(tlNow()) + TL_NOWPAD - sc.clientWidth); }
function tlX(t) { return TL_PADL + t / 60 * TL.pph; }
function tlTAt(px) { return (px - TL_PADL) * 60 / TL.pph; }
function tlDate(t) { return new Date(tlData.epoch_ms + t * 60000); }
function tlHM(t) { const d = tlDate(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function tlDayHM(t) { const d = tlDate(t); return TL_WD[d.getDay()] + " " + tlHM(t); }
function tlEl(id) { return document.getElementById(id); }

function tlVisible() {
  const sc = tlEl("tl-scroller");
  const tA = tlTAt(sc.scrollLeft), tB = tlTAt(sc.scrollLeft + sc.clientWidth);
  const now = tlNow();
  return tlData.sessions.map((s, i) => ({ s, si: i })).filter(o => {
    if (!TL.showSys && o.s.sys) return false;
    const end = o.s.kill != null ? o.s.kill : now;
    return s0Start(o.s) <= tB && end >= tA;
  }).map(o => {
    // idle-in-view uses the same segment tier the bars render at this zoom
    const segs = TL.pph >= 60 && o.s.fsegs ? o.s.fsegs : o.s.segs;
    const activeIn = segs.some(g => g[0] <= tB && g[1] >= tA);
    const evIn = o.s.ev.some(e => e[0] >= tA && e[0] <= tB);
    return { s: o.s, si: o.si, dim: !activeIn && !evIn };
  }).filter(o => !TL.activeOnly || !o.dim);
}
function s0Start(s) { return s.segs.length ? s.segs[0][0] : s.a; }

// Lanes blocked by v6 resolved group, groups ordered by first activity. Every group gets its
// header — even a single visible lane — so membership is always explicit.
function tlLayoutRows(vis) {
  const rows = [], bands = [];
  let y = TL_AXH, gi = 0;
  for (const g of tlData.groups) {
    const members = vis.filter(v => v.s.g === g.k);
    if (!members.length) continue;
    const y0 = y;
    rows.push({ type: "g", g: g.k, color: g.color, y });
    y += TL_GH;
    for (const v of members) { rows.push({ type: "s", v, g, y }); y += TL_LANE; }
    bands.push({ k: g.k, y0, y1: y, color: g.color, zebra: gi % 2 === 1 });
    y += TL_GGAP;
    gi++;
  }
  return { rows, bands, H: y - TL_GGAP + TL_PADB };
}
function tlTickSteps() {
  if (TL.pph >= 1200) return [5, 15];
  if (TL.pph >= 400) return [10, 30];
  if (TL.pph >= 150) return [30, 60];
  if (TL.pph >= 60) return [60, 180];
  if (TL.pph >= 20) return [180, 360];
  return [360, 720];
}

function tlRender() {
  const sc = tlEl("tl-scroller"), svg = tlEl("tl-svg"), labels = tlEl("tl-labels-inner");
  if (!sc || !tlData) return;
  const vis = tlVisible();
  const { rows, bands, H } = tlLayoutRows(vis);
  const now = tlNow(), W = Math.round(tlX(tlEnd()) + TL_PADR);
  const [minor, major] = tlTickSteps();
  tlTips = []; tlRowYs = {};
  const idxCy = {};
  let o = "";
  for (const d of tlData.days) {
    if (!d.wk) continue;
    const x0 = tlX(Math.max(d.o, 0)), x1 = tlX(Math.min(d.o + 1440, tlEnd()));
    if (x1 > x0) o += `<rect class="tl-wkend" x="${x0}" y="${TL_AXH - 14}" width="${x1 - x0}" height="${H - TL_AXH + 8}"/>`;
  }
  for (const b of bands)
    if (b.zebra) o += `<rect class="tl-gband" x="0" y="${b.y0}" width="${W}" height="${b.y1 - b.y0}"/>`;
  for (let m = 0; m <= tlEnd(); m += minor) {
    if (((m % 1440) + 1440) % 1440 === 0) continue;
    const X = tlX(m), isMaj = m % major === 0;
    o += `<line class="tl-grid${isMaj ? " major" : ""}" x1="${X}" y1="${TL_AXH - 14}" x2="${X}" y2="${H - 4}"/>`;
  }
  for (const d of tlData.days)
    if (d.o >= 0) o += `<line class="tl-dayline" x1="${tlX(d.o)}" y1="4" x2="${tlX(d.o)}" y2="${H - 4}"/>`;
  // lanes
  for (const row of rows) {
    if (row.type !== "s") continue;
    const { s, si, dim } = row.v, g = row.g, cy = row.y + TL_LANE / 2;
    // zoomed in (>=60 px/h) the fine 10-min idle tier applies; the overview keeps the 3 h tier
    const segsArr = TL.pph >= 60 && s.fsegs ? s.fsegs : s.segs;
    tlRowYs[s.sid] = cy;
    idxCy[si] = cy;
    o += `<g style="--c:${g.color}"${dim ? ' opacity=".45"' : ""} data-lane="${si}" data-hay="${esc((s.id + " " + s.g + " " + s.meta + " " + s.blurb).toLowerCase())}">`;
    o += `<rect class="tl-rowhit" x="0" y="${row.y}" width="${W}" height="${TL_LANE}"/>`;
    if (TL.showB) {   // the lane body: bars, idle dots, × — off = dots-only view
      const lastEnd = segsArr.length ? segsArr[segsArr.length - 1][1] : s.a;
      const xe = tlX(s.kill != null ? s.kill : now);
      const idles = [];   // every silent stretch: between activity runs, then the tail to ×/now
      for (let gi = 0; gi + 1 < segsArr.length; gi++)
        idles.push([tlX(segsArr[gi][1]) + 4, tlX(segsArr[gi + 1][0]) - 4]);
      idles.push([tlX(lastEnd) + 4, xe - 7]);
      for (const [ix1, ix2] of idles)
        if (ix2 > ix1 + 3) o += `<line class="tl-idle" x1="${ix1}" y1="${cy}" x2="${ix2}" y2="${cy}"/>`;
      if (s.kill != null) o += `<text class="tl-killx" x="${Math.max(xe - 4, tlX(lastEnd) + 2)}" y="${cy + 4}">×</text>`;
      for (const seg of segsArr) {
        let x1 = tlX(seg[0]), x2 = tlX(seg[1]);
        if (x2 - x1 < 6) x2 = x1 + 6;
        o += `<rect class="tl-bar" data-open="${s.sid}" x="${x1}" y="${cy - 7}" width="${x2 - x1}" height="14"/>`;
      }
    }
    let px = -99, flip = 1;
    for (const e of s.ev) {
      if (e[1] === "u" ? !TL.showU : !TL.showM) continue;
      const X = tlX(e[0]);
      let dy = 0;
      if (X - px < 9) { dy = 6 * flip; flip = -flip; } else flip = 1;
      px = X;
      const i = tlTips.length;
      tlTips.push({ title: `${tlDayHM(e[0])} — ${s.id}`, body: e[2], sid: s.sid, t: e[0], k: e[1] });
      if (e[1] === "u") o += `<circle class="tl-ev-u" cx="${X}" cy="${cy + dy}" r="4.6"/>`;
      else o += `<path class="tl-ev-m" d="M ${X} ${cy + dy - 5.2} L ${X + 5.2} ${cy + dy} L ${X} ${cy + dy + 5.2} L ${X - 5.2} ${cy + dy} Z"/>`;
      o += `<circle class="tl-hit" data-i="${i}"${e[3] ? ` data-aid="${e[3]}"` : ""} cx="${X}" cy="${cy + dy}" r="9"/>`;
    }
    o += "</g>";
  }
  // peer-message edges: vertical arrow at send time, sender lane -> receiver lane.  A sender
  // with no lane (tx-assistant, out of window) or one culled from the current layout degrades
  // to a short stub dropping into the receiver.
  if (TL.showE) {
    for (const [m, f, tIdx, token, snip, kind] of tlData.edges || []) {
      const toCy = idxCy[tIdx];
      if (toCy == null || f === tIdx) continue;
      const X = tlX(m);
      const fromCy = f >= 0 ? idxCy[f] : null;
      const fromName = f >= 0 ? tlData.sessions[f].id : token;
      const toS = tlData.sessions[tIdx];
      const verb = kind === "spawn" ? " · spawned" : kind === "resume" ? " · resumed" : "";
      const i = tlTips.length;
      tlTips.push({ title: `${fromName} → ${toS.id}${verb} · ${tlDayHM(m)}`, body: snip || (kind !== "msg" ? toS.blurb : ""), sid: toS.sid, t: m, k: "p" });
      let y1, dir;
      if (fromCy != null) { dir = fromCy < toCy ? 1 : -1; y1 = fromCy + dir * 9; }
      else { dir = 1; y1 = toCy - 20; }
      const y2 = toCy - dir * 10;
      o += `<g class="tl-edge"><line x1="${X}" y1="${y1}" x2="${X}" y2="${y2}"/>` +
           `<path d="M ${X} ${toCy - dir * 4} L ${X - 3.5} ${y2} L ${X + 3.5} ${y2} Z"/>` +
           `<circle class="tl-hit" data-i="${i}" cx="${X}" cy="${y2}" r="8"/></g>`;

  }
  // sticky axis strip: an opaque band that tracks scrollTop (translated in the scroll handler)
  o += `<g id="tl-axis"><rect class="tl-axbg" x="0" y="0" width="${W}" height="${TL_AXH - 14}"/>`;
  o += `<line class="tl-axline" x1="0" y1="${TL_AXH - 14}" x2="${W}" y2="${TL_AXH - 14}"/>`;
  for (let m = 0; m <= tlEnd(); m += major)
    if (((m % 1440) + 1440) % 1440 !== 0) o += `<text class="tl-tlab" x="${tlX(m) + 3}" y="${TL_AXH - 20}">${tlHM(m)}</text>`;
  for (const d of tlData.days)
    o += `<text class="tl-dlab" data-o="${d.o}" x="${tlX(Math.max(d.o, 0)) + 6}" y="16">${esc(d.label)}</text>`;
  o += "</g>";
  // now marker: repositioned by the 1s clock without a re-render
  o += `<g id="tl-nowg"><line class="tl-now" x1="${tlX(now)}" y1="18" x2="${tlX(now)}" y2="${H - 4}"/>`;
  o += `<text class="tl-nowlab" x="${tlX(now) + 5}" y="${TL_AXH - 2}">now</text>`;
  for (const row of rows) {
    if (row.type !== "s" || !row.v.s.live || !TL.showB) continue;
    const cy = row.y + TL_LANE / 2;
    o += `<path class="tl-live" style="--c:${row.g.color}" data-cy="${cy}" d="M ${tlX(now) + 4} ${cy - 4.5} L ${tlX(now) + 10.5} ${cy} L ${tlX(now) + 4} ${cy + 4.5} Z"/>`;
  }
  o += "</g>";
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = o;
  labels.style.height = H + "px";
  let lo = "";
  for (const b of bands) {
    if (b.zebra) lo += `<div class="tl-lband" style="top:${b.y0}px;height:${b.y1 - b.y0}px"></div>`;
    lo += `<div class="tl-gstrip" style="--c:${b.color};top:${b.y0}px;height:${b.y1 - b.y0}px;background:var(--c)"></div>`;
  }
  for (const row of rows) {
    if (row.type === "g") {
      lo += `<div class="tl-glab" draggable="true" style="--c:${row.color};top:${row.y}px;height:${TL_GH - 3}px;color:var(--c)" data-g="${esc(row.g)}">${esc(row.g)}</div>`;
      continue;
    }
    const { s, si, dim } = row.v;
    const meta = s.meta;
    lo += `<div class="tl-lab${dim ? " dim-idle" : ""}${TL.sel.has(s.sid) ? " sel" : ""}" data-si="${si}" data-sid="${s.sid}" data-hay="${esc((s.id + " " + s.g + " " + s.meta + " " + s.blurb).toLowerCase())}" style="--c:${row.g.color};top:${row.y}px;height:${TL_LANE}px">` +
          `<span class="nm"><span class="dot"></span>${esc(s.id)}</span><span class="mt">${esc(meta)}</span></div>`;
  }
  labels.innerHTML = lo;
  tlBands = bands;
  tlDayLabelEls = Array.from(svg.querySelectorAll(".tl-dlab"));
  tlEl("tl-labelsbox").scrollTop = sc.scrollTop;
  tlSyncScroll();
  tlApplySearch();
  tlReanchorPin();
}

// day labels clamp to the viewport's left edge (calendar-style), axis band follows scrollTop
function tlSyncScroll() {
  const sc = tlEl("tl-scroller");
  if (!sc) return;
  const axis = tlEl("tl-axis");
  if (axis) axis.setAttribute("transform", `translate(0 ${sc.scrollTop})`);
  const nowg = tlEl("tl-nowg");
  for (const el of tlDayLabelEls) {
    const dayO = +el.dataset.o;
    const dayEndX = tlX(Math.min(dayO + 1440, tlEnd()));
    el.setAttribute("x", Math.min(Math.max(tlX(Math.max(dayO, 0)), sc.scrollLeft) + 6, dayEndX - 70));
  }
}

function tlMaybeRelayout() {
  if (TL.dragging) return;   // lanes popping in/out mid-drag is disorienting — settle on release
  const vis = tlVisible();
  const key = vis.map(v => v.si + (v.dim ? "~" : "")).join("|");
  if (key !== tlVisKey) { tlVisKey = key; tlRender(); }
}

function tlTipShow(html, cx, cy, pin) {
  const tip = tlEl("tl-tip");
  if (!tip) return;
  tip.innerHTML = html;
  tip.style.display = "block";
  tip.classList.toggle("pinned", !!pin);
  const r = tip.getBoundingClientRect();
  let L = cx + 14, T = cy + 14;
  if (L + r.width > innerWidth - 8) L = cx - r.width - 12;
  if (T + r.height > innerHeight - 8) T = cy - r.height - 12;
  tip.style.left = Math.max(4, L) + "px";
  tip.style.top = Math.max(4, T) + "px";
}
function tlShowTip(i, cx, cy, pin) {
  const d = tlTips[i];
  if (!d) return;
  const link = pin ? `<a href="#" data-quick="1">quick view ›</a> &nbsp;·&nbsp; <a href="#/chats/${d.sid}">detail →</a>` : "";
  tlTipShow(`<div class="t1"><b>${esc(d.title)}</b>${d.k === "u" ? " · you" : ""}</div><div class="t2">${esc(d.body)}</div>${link}`, cx, cy, pin);
  if (pin) { TL.pinId = { sid: d.sid, t: d.t, k: d.k }; TL.pinAt = { x: cx, y: cy }; }
}
function tlHideTip() {
  const tip = tlEl("tl-tip");
  if (tip) { tip.style.display = "none"; tip.classList.remove("pinned"); }
  TL.pinId = null;
}
// A pinned tip survives data-driven re-renders by identity, not index.
function tlReanchorPin() {
  if (!TL.pinId) return;
  const i = tlTips.findIndex(d => d.sid === TL.pinId.sid && d.t === TL.pinId.t && d.k === TL.pinId.k);
  if (i < 0) tlHideTip();
  else tlShowTip(i, TL.pinAt.x, TL.pinAt.y, true);
}

// ---- group drag&drop reordering ----
function tlHoveredBlock(e) {
  const inner = tlEl("tl-labels-inner");
  const y = e.clientY - inner.getBoundingClientRect().top;
  for (const b of tlBands) if (y < b.y1) return b.k;
  return null;   // below every block
}
// Coarse-block insertion: hovering a block below the dragged group means AFTER it, above means
// BEFORE it — direction decides, so a one-slot move works wherever inside the block you drop.
// Returns the group to insert before, null for "move to end", undefined for a no-op.
function tlInsertBefore(src, hovered) {
  if (!hovered) return null;
  const keys = tlData.groups.map(g => g.k);
  const s = keys.indexOf(src), t = keys.indexOf(hovered);
  if (s < 0 || t < 0 || s === t) return undefined;
  return t > s ? (keys[t + 1] !== undefined ? keys[t + 1] : null) : hovered;
}
async function tlReorderGroup(src, before) {
  if (!src || src === before) return;
  const order = tlData.groups.map(g => g.k).filter(k => k !== src);
  const at = before ? order.indexOf(before) : order.length;
  order.splice(at < 0 ? order.length : at, 0, src);
  const byK = {};
  for (const g of tlData.groups) byK[g.k] = g;
  tlData.groups = order.map(k => byK[k]);
  tlVisKey = "";
  tlRender();                                   // optimistic — the saved order returns on the next tick
  try {
    await fetch("/api/timeline/order", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ order }),
    });
  } catch (e) { /* server truth self-heals via the refresh tick */ }
}
function tlSyncEdit() {
  const cb = tlEl("tl-edit"), bar = tlEl("tl-msgbar"), wrap = document.querySelector(".tl-wrap");
  if (!cb || !bar) return;
  cb.checked = TL.edit;
  bar.style.display = TL.edit ? "flex" : "none";
  if (wrap) wrap.classList.toggle("editing", TL.edit);
  tlEl("tl-selcount").textContent = TL.sel.size + " selected";
}
async function tlSendMsg() {
  const input = tlEl("tl-msginput"), status = tlEl("tl-msgstatus");
  const request = input.value.trim();
  if (!TL.sel.size) { status.textContent = "select at least one session"; return; }
  if (!request) { status.textContent = "type a message"; return; }
  status.textContent = "sending…";
  try {
    const r = await fetch("/api/timeline/message", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: [...TL.sel], request }),
    });
    const j = await r.json();
    if (j.ok) {
      status.textContent = "sent to tx-assistant ✓";
      input.value = "";
      TL.sel.clear();
      tlRender();
      tlSyncEdit();
      setTimeout(() => { const s2 = tlEl("tl-msgstatus"); if (s2 && s2.textContent.startsWith("sent")) s2.textContent = ""; }, 4000);
    } else {
      status.textContent = j.error || "failed";
    }
  } catch (e) { status.textContent = "failed: " + e.message; }
}
// The drawer's direct reply: plain user text typed into the lane's own pane — the transcript
// records a `u` row, so the sent line appears in the tail (and as a ring) on the next poll.
async function tlDrawerSend() {
  const input = tlEl("tl-dinput"), status = tlEl("tl-dstatus");
  const key = TL.drawer.sid, target = TL.drawer.target || key;
  const request = input.value.trim();
  if (!target || !request) return;
  status.textContent = "sending…";
  try {
    const r = await fetch("/api/timeline/" + encodeURIComponent(target) + "/message", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request }),
    });
    const j = await r.json();
    const s2 = tlEl("tl-dstatus");
    if (!j.ok) { if (s2) s2.textContent = j.error || "failed"; return; }
    if (s2) s2.textContent = "sent ✓";
    if (TL.drawer.sid === key) {   // still the same lane (not navigated away mid-send)
      TL.drawer.draft = "";
      TL.drawer.stick = true;      // tail, so the reply is visible when the transcript row lands
      const cur = tlEl("tl-dinput"), body = tlEl("tl-dbody");
      if (cur) { cur.value = ""; cur.focus(); }
      if (body) body.scrollTop = body.scrollHeight;
    }
    setTimeout(() => { const s3 = tlEl("tl-dstatus"); if (s3 && s3.textContent === "sent ✓") s3.textContent = ""; }, 4000);
  } catch (e) { const s2 = tlEl("tl-dstatus"); if (s2) s2.textContent = "failed: " + e.message; }
}
function tlApplySearch() {
  if (!tlActive()) return;
  const needle = searchBox.value.trim().toLowerCase();
  const svg = tlEl("tl-svg"), labels = tlEl("tl-labels-inner");
  if (!svg) return;
  for (const el of [...svg.querySelectorAll("[data-hay]"), ...labels.querySelectorAll("[data-hay]")])
    el.classList.toggle("tl-dim", needle !== "" && !el.dataset.hay.includes(needle));
}

function tlClockTick() {
  if (!tlActive() || !tlData || !tlEl("tl-svg")) return;
  const now = tlNow();
  if (tlX(now) > +tlEl("tl-svg").getAttribute("width") - TL_PADR + 30) { tlRender(); return; }
  const nowg = tlEl("tl-nowg");
  if (!nowg) return;
  const line = nowg.querySelector(".tl-now"), lab = nowg.querySelector(".tl-nowlab");
  line.setAttribute("x1", tlX(now)); line.setAttribute("x2", tlX(now));
  lab.setAttribute("x", tlX(now) + 5);
  for (const ch of nowg.querySelectorAll(".tl-live")) {
    const cy = +ch.dataset.cy, X = tlX(now);
    ch.setAttribute("d", `M ${X + 4} ${cy - 4.5} L ${X + 10.5} ${cy} L ${X + 4} ${cy + 4.5} Z`);
  }
  if (TL.follow) {
    const sc = tlEl("tl-scroller");
    if (sc) { sc.scrollLeft = tlMaxScroll(sc); TL.sl = sc.scrollLeft; }
  }
}

function tlSetZoom(np, anchor) {
  const sc = tlEl("tl-scroller");
  np = Math.max(4, Math.min(6000, np));   // 6000 px/h ≈ a 15-minute span across the viewport
  if (anchor == null) anchor = sc.clientWidth / 2;
  const t = tlTAt(sc.scrollLeft + anchor);
  TL.pph = np; tlVisKey = "";
  tlRender();
  sc.scrollLeft = TL.follow ? tlMaxScroll(sc) : Math.min(tlX(t) - anchor, tlMaxScroll(sc));
  TL.sl = sc.scrollLeft;
  tlMaybeRelayout();
}


// ---- drawer (quick view) ----
// The prototype's right-hand conversation panel, fed lazily by /api/timeline/<sid>/dialogue.
// Open state rides in the hash (#/timeline/<sid>) so it deep-links, survives refresh-tick
// re-renders, and closes with back/Esc. While the viewer sits at the bottom, live appends
// keep it pinned there (chat-app tailing); scrolled up, position is preserved.
async function tlRenderDrawer() {
  const dw = tlEl("tl-drawer");
  if (!dw) return;
  const sid = TL.drawer.sid;
  if (!sid) { dw.classList.remove("open"); return; }
  let d;
  try { d = await getJSON("/api/timeline/" + encodeURIComponent(sid) + "/dialogue"); }
  catch (e) {
    dw.classList.add("open");
    const body = tlEl("tl-dbody");
    if (body) body.innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
    return;
  }
  if (TL.drawer.sid !== sid || !tlEl("tl-drawer")) return;   // closed or navigated mid-fetch
  dw.classList.add("open");
  tlEl("tl-dtitle").textContent = d.name;
  tlEl("tl-dmeta").textContent = d.meta + " · " + d.rows.length + " entries";
  tlEl("tl-ddetail").href = "#/chats/" + d.sid;
  tlEl("tl-dfilter").value = TL.drawer.filter;
  // reply only reaches a live pane — a dead lane keeps the read-only drawer. `d.sid` is the
  // lane's PRIMARY record (a deep-linked hash may carry an older id of the merged chain), so it
  // is both the liveness lookup and the send target.
  TL.drawer.target = d.sid;
  const lane = tlData.sessions.find(s => s.sid === d.sid);
  dw.classList.toggle("can-reply", !!(lane && lane.live));
  const dinp = tlEl("tl-dinput");
  dinp.placeholder = "reply to " + d.name + "…";
  if (document.activeElement !== dinp && dinp.value !== TL.drawer.draft) dinp.value = TL.drawer.draft;
  // click a lane → just type: opening focuses the reply box ONCE (a consumed flag — later ticks
  // must not re-steal focus after a deliberate blur)
  if (TL.drawer.focusOnOpen) {
    TL.drawer.focusOnOpen = false;
    if (lane && lane.live) dinp.focus({ preventScroll: true });
  }
  const body = tlEl("tl-dbody"), em = tlData.epoch_ms;
  body.innerHTML = d.rows.map((r, i) => {
    const m = (r[0] * 1000 - em) / 60000;
    return '<div class="tl-crow tl-cr-' + r[1] + '" data-m="' + m.toFixed(2) + '"><time>' + tlDayHM(m) + "</time><div class=\"ct\">" + esc(r[2]) + "</div></div>";
  }).join("") || '<div class="tl-crow"><time></time><div class="ct muted">no transcript recorded</div></div>';
  tlApplyDrawerFilter();
  if (TL.drawer.t != null) {
    const rows = body.querySelectorAll(".tl-crow");
    let target = rows[rows.length - 1];
    for (const el of rows) if (+el.dataset.m >= TL.drawer.t - 0.6) { target = el; break; }
    if (target) {
      target.scrollIntoView({ block: "center" });
      target.classList.add("tl-cr-hl");
      setTimeout(() => target.classList.remove("tl-cr-hl"), 2500);
    }
    TL.drawer.t = null; TL.drawer.stick = false; TL.drawer.top = body.scrollTop;
  } else if (TL.drawer.stick) {
    body.scrollTop = body.scrollHeight;
  } else {
    body.scrollTop = TL.drawer.top;
  }
  body.onscroll = () => {
    TL.drawer.top = body.scrollTop;
    TL.drawer.stick = body.scrollTop + body.clientHeight >= body.scrollHeight - 40;
  };
  tlEl("tl-dfilter").oninput = () => { TL.drawer.filter = tlEl("tl-dfilter").value; tlApplyDrawerFilter(); };
  tlEl("tl-dclose").onclick = () => { location.hash = "/timeline"; };
}
function tlApplyDrawerFilter() {
  const q = TL.drawer.filter.trim().toLowerCase();
  const body = tlEl("tl-dbody");
  if (!body) return;
  for (const el of body.children) el.style.display = !q || el.textContent.toLowerCase().includes(q) ? "" : "none";
}
function tlOpenDrawer(sid, t) {
  TL.drawer = { sid, t: t == null ? null : t, filter: "", draft: "", stick: t == null, top: 0, focusOnOpen: true };
  const target = "/timeline/" + sid;
  if (location.hash.replace(/^#/, "") === target) tlRenderDrawer();
  else location.hash = target;
}

// ---- context menu ----
function tlShowMenu(x, y, items) {
  const menu = tlEl("tl-menu");
  if (!menu) return;
  menu.innerHTML = items.map((it, i) =>
    it.sep ? '<div class="sep"></div>' : '<div class="mi" data-mi="' + i + '">' + it.label + "</div>").join("");
  menu.style.display = "block";
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, innerWidth - r.width - 6) + "px";
  menu.style.top = Math.min(y, innerHeight - r.height - 6) + "px";
  menu.onclick = e => {
    const el = e.target.closest(".mi");
    if (!el) return;
    const it = items[+el.dataset.mi];
    tlHideMenu();
    it.act();
  };
}

document.addEventListener("keydown", e => {
  if (!tlActive()) return;
  // ↑/↓ walk the drawer through the lanes in their on-screen order — but never while a draft is
  // being composed (a switch resets the drawer state) or while another input holds the caret
  if ((e.key === "ArrowUp" || e.key === "ArrowDown") && TL.drawer.sid && tlData) {
    const ae = document.activeElement;
    if (ae && ae.tagName === "INPUT" && (ae.id !== "tl-dinput" || ae.value)) return;
    const sids = tlLayoutRows(tlVisible()).rows.filter(r => r.type === "s").map(r => r.v.s.sid);
    if (!sids.length) return;
    const here = TL.drawer.target || TL.drawer.sid;
    const cur = sids.indexOf(here);
    const next = cur < 0
      ? (e.key === "ArrowDown" ? 0 : sids.length - 1)
      : (cur + (e.key === "ArrowDown" ? 1 : -1) + sids.length) % sids.length;
    e.preventDefault();
    if (sids[next] !== here) tlOpenDrawer(sids[next], null);
    return;
  }
  if (e.key !== "Escape") return;
  const menu = tlEl("tl-menu");
  if (menu && menu.style.display === "block") return tlHideMenu();
  if (TL.pinId) return tlHideTip();
  if (TL.edit) { TL.edit = false; TL.sel.clear(); tlRender(); tlSyncEdit(); return; }
  if (TL.drawer.sid) {
    const inp = tlEl("tl-dinput");
    // a half-typed reply: the first Escape only leaves the box (draft kept), the next closes
    if (inp && document.activeElement === inp && inp.value) return inp.blur();
    location.hash = "/timeline";
  }
});

// ---- routing ----
function setNav(tab, isList) {
  tabChats.classList.toggle("active", tab === "chats");
  tabArtifacts.classList.toggle("active", tab === "artifacts");
  tabTimeline.classList.toggle("active", tab === "timeline");
  searchBox.classList.toggle("hidden", !isList);
  hotWindowControl.classList.toggle("hidden", !(tab === "chats" && isList));
  // The reader is a full-height app view with its own filter box — it wants no page scroll under it.
  document.body.classList.toggle("full", tab === "artifacts");
  if (!isList) filterables = [];
}
const UUID_RE = /^[0-9a-fA-F-]{36}$/;
function route() {
  const hash = location.hash.replace(/^#/, "");
  if (hash.startsWith("/chats/")) return renderChatDetail(hash.slice("/chats/".length));
  if (hash === "/timeline" || hash.startsWith("/timeline/")) return renderTimeline(hash.startsWith("/timeline/") ? decodeURIComponent(hash.slice("/timeline/".length)) : null);
  if (hash === "/artifacts") return renderArtifactReader(null);
  if (hash.startsWith("/artifacts/")) return renderArtifactReader(hash.slice("/artifacts/".length));
  if (hash.startsWith("/") && UUID_RE.test(hash.slice(1))) return renderArtifactReader(hash.slice(1)); // legacy links
  return renderChats();
}
document.getElementById("nav-refresh").onclick = route;
window.addEventListener("hashchange", route);
route();

// ---- auto refresh ----
// A 5s tick re-fetches the current view's payloads, fingerprints them with the volatile relative-age
// strings stripped, and re-renders only on a real change (or once a minute, so the ages tick).
// Scroll, open folds, and diff picks survive the swap; a hidden tab pauses and resyncs on focus;
// an active text selection defers the tick so a copy in progress is never stomped.
const REFRESH_MS = 5000, FORCE_AGE_REFRESH_EVERY = 12;
function viewUrls() {
  const hash = location.hash.replace(/^#/, "");
  if (hash.startsWith("/chats/")) {
    const id = encodeURIComponent(hash.slice("/chats/".length));
    return ["/api/chats/" + id, "/api/chats/" + id + "/dialogue"];
  }
  if (hash === "/timeline" || hash.startsWith("/timeline/")) {
    const urls = ["/api/timeline"];
    if (hash.startsWith("/timeline/")) urls.push("/api/timeline/" + encodeURIComponent(hash.slice("/timeline/".length)) + "/dialogue");
    return urls;
  }
  // The reader always shows the index rail beside the document, so both feeds are its live surface.
  if (hash === "/artifacts") return ["/api/artifacts"];
  if (hash.startsWith("/artifacts/")) {
    return ["/api/artifacts", "/api/artifacts/" + encodeURIComponent(avParse(hash.slice("/artifacts/".length)).id)];
  }
  if (hash.startsWith("/") && UUID_RE.test(hash.slice(1))) return ["/api/artifacts", "/api/artifacts/" + hash.slice(1)];
  return ["/api/chats"];
}
const stripVolatile = (k, v) => (k === "ago" || k.endsWith("_ago") ? undefined : v);
let lastFingerprint = "", tickCount = 0, refreshing = false;
async function refreshTick() {
  if (refreshing || document.hidden) return;
  const selection = getSelection();
  if (selection && !selection.isCollapsed && app.contains(selection.anchorNode)) return;
  refreshing = true;
  try {
    const urls = viewUrls();
    const datas = await Promise.all(urls.map(u => getJSON(u, true)));
    if (viewUrls().join() !== urls.join()) return;   // navigated away mid-fetch
    const fingerprint = JSON.stringify(datas, stripVolatile);
    tickCount++;
    const force = tickCount % FORCE_AGE_REFRESH_EVERY === 0;
    if (fingerprint === lastFingerprint && !force) return;
    lastFingerprint = fingerprint;
    const scroll = { x: scrollX, y: scrollY };
    const openFolds = Array.from(document.querySelectorAll("details[open] summary")).map(s => s.textContent);
    await route();
    document.querySelectorAll("details summary").forEach(s => {
      if (openFolds.includes(s.textContent)) s.parentElement.open = true;
    });
    scrollTo(scroll.x, scroll.y);
  } catch (e) {
    // transient fetch failure — the next tick retries
  } finally {
    refreshing = false;
  }
}
setInterval(refreshTick, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshTick(); });
window.addEventListener("hashchange", () => { lastFingerprint = ""; });
</script>
</body>
