<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tx-ide · chats & artifacts</title>
<style>
  /* Palette mirrors the analytics house style (polymarket dashboard). Deliberately plain: flat
     colors only — no gradients, no alpha, no blur, no rounding, no shadows. */
  :root {
    color-scheme: dark;
    --bg: #080b10; --panel: #0e131b; --panel-2: #121923; --line: #253044; --line-soft: #18202e;
    --text: #edf3fb; --muted: #8290a5; --dim: #3d5273;
    --blue: #5ca8ff; --green: #48d597; --red: #ff7085; --amber: #ffcb6b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text); font: 14px/1.55 var(--sans); min-height: 100vh;
  }
  a { color: var(--blue); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }

  /* ---- header ---- */
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px;
    padding: 12px 28px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .2px; color: var(--text); }
  .brand .glyph { color: var(--blue); }
  nav.tabs { display: inline-flex; gap: 16px; }
  nav.tabs a { color: var(--muted); font-size: 13px; }
  nav.tabs a:hover { color: var(--text); text-decoration: none; }
  nav.tabs a.active { color: var(--text); }
  header .spacer { flex: 1; }
  #search {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 5px 10px; width: 220px; font: 13px var(--sans);
  }
  #search:focus { outline: none; border-color: var(--blue); }
  #search.hidden { display: none; }
  /* Hot-window control: number + unit picking the freshness threshold renderChats reads. */
  #hot-window { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #hot-window.hidden { display: none; }
  #hot-window .hot-label { color: var(--muted); font-size: 12.5px; }
  #hot-window .hot-label b { color: var(--green); font-weight: 600; }
  #hot-window input {
    width: 56px; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 5px 4px 5px 8px; font: 12.5px var(--mono);
  }
  #hot-window input:focus { outline: none; border-color: var(--blue); }

  main { width: 100%; padding: 22px 28px 80px; }

  /* ---- chips / badges / state dots ---- */
  /* Tag chips exactly as the sessions-graph dashboard draws them: per-tag color (the terminal
     picker's tag_cube palette, served as --chip), pill outline, 16% tinted fill. */
  /* Effort-group chip (⊙, dashed outline, no fill) — reads distinct from tag chips. */
  .chip.gchip { background: transparent; border-style: dashed; }
  .chip {
    display: inline-block; margin-right: 6px; font-size: 10.5px; padding: 1px 6px;
    border-radius: 999px; color: var(--chip, var(--dim)); border: 1px solid var(--chip, var(--dim));
    background: color-mix(in srgb, var(--chip, var(--dim)) 16%, transparent);
    white-space: nowrap;
  }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px;
         background: var(--dim); vertical-align: 1px; }
  .st-working  .dot { background: var(--green); }
  .st-waiting  .dot { background: var(--blue); }
  .st-idle     .dot { background: var(--muted); }
  .st-alive    .dot { background: var(--green); }
  .st-exited   .dot { background: var(--dim); }
  .st-archived .dot { background: var(--amber); }
  .state { white-space: nowrap; color: var(--muted); font-size: 12.5px; }
  .badge { color: var(--amber); font-size: 12px; }
  .num { font-family: var(--mono); font-size: 12.5px; }
  .num.zero { color: var(--dim); }

  /* ---- grid tables (Notion-style rows) ---- */
  table.grid { width: 100%; border-collapse: collapse; }
  .grid th {
    text-align: left; font: 600 10.5px var(--mono); text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted); padding: 8px 10px;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .grid td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: baseline; }
  .grid tbody tr.rowlink { cursor: pointer; }
  .grid tbody tr.rowlink:hover { background: var(--panel); }
  .grid .right { text-align: right; }
  /* Notion-style sub-item toggle: parents get a chevron that folds their subtree; leaves get an
     equal-width spacer so names align. The whole gutter (indent + chevron) is the hit target,
     fattened to the full row height and pulled flush to the row's left edge (the negative margins
     swallow the cell padding), so folding never mis-clicks into the session detail. */
  .tgl, .tgl-spacer { display: inline-block; width: 24px; text-align: center; font-family: var(--mono); }
  .gut {
    display: inline-block; cursor: pointer;
    padding: 12px 2px 12px 10px; margin: -12px -2px -12px -10px;
  }
  /* The glyph box spans [10,34] inside a visible block running 0→34 (row edge to name); shifting
     it 5px left puts the triangle on the block's optical center. */
  .gut .tgl { color: var(--muted); position: relative; left: -5px; }
  .gut:hover { background: var(--panel-2); }
  .gut:hover .tgl { color: var(--text); }
  /* The visible sort key: a family orders by its subtree's newest interaction, so the root shows
     that time in green beside its own dim age, and the descendant that produced it carries the
     same green time — matching values connect the pair. */
  .fresh { color: var(--green); }
  .own { color: var(--dim); }
  /* A hot session (interaction inside the header's hot window) nested in a tree: green name —
     both when promoted under a collapsed ancestor and at its true position once the tree is
     expanded. */
  .grid b.hot { color: var(--green); }
  .empty { color: var(--muted); text-align: center; padding: 70px 0; }
  .err { color: var(--red); font-family: var(--mono); font-size: 13px; }

  /* ---- detail layout ---- */
  .crumbs { font-size: 13px; margin-bottom: 14px; color: var(--muted); }
  h1.doc { font-size: 21px; margin: 0 0 2px; font-weight: 650; }
  .subhead { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; max-width: 84ch; }
  section { margin: 30px 0; }
  section > h2 {
    font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .9px;
    color: var(--muted); margin: 0 0 4px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
  }
  .props { display: grid; grid-template-columns: 175px 1fr; font-size: 13.5px; }
  .props > div { padding: 6px 0; border-bottom: 1px solid var(--line-soft); overflow-wrap: anywhere; }
  .props .k { color: var(--muted); }
  details.fold summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 6px 0; }
  details.fold summary:hover { color: var(--text); }
  pre.cmd {
    font: 12px/1.5 var(--mono); background: var(--panel);
    padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0;
  }

  /* ---- conversation ---- */
  .chat-sep {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 26px 0 4px; padding-top: 8px; border-top: 1px solid var(--line);
    font: 12px var(--mono); color: var(--muted);
  }
  .chat-sep b { color: var(--text); font-weight: 600; }
  .turn { padding: 10px 0 2px; }
  .turn .who { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .9px; }
  .turn.you .who { color: var(--blue); }
  .turn.agent .who { color: var(--green); }
  .turn .ts { color: var(--dim); font: 10.5px var(--mono); margin-left: 8px; }
  .turn .body { max-width: 110ch; }   /* full-width page; prose keeps a readable measure */
  .turn.you .body {
    white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 0;
    border-left: 2px solid var(--line); padding-left: 12px;
  }
  .turn.agent .body { margin: 4px 0 0; }
  .turn.tools { color: var(--dim); font: 11px var(--mono); padding: 6px 0; }
  #convLoad { color: var(--muted); font: 12px var(--mono); padding: 14px 0; }

  /* ---- rendered markdown ---- */
  .md { overflow-wrap: anywhere; }
  .md h1,.md h2,.md h3,.md h4 { line-height: 1.3; margin: 1.1em 0 .45em; font-weight: 650; }
  .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.06em; }
  .md h4 { font-size: 1em; }
  .md p { margin: .55em 0; } .md ul,.md ol { margin: .45em 0; padding-left: 1.5em; }
  .md li { margin: .18em 0; }
  .md code { font-family: var(--mono); font-size: .87em; background: var(--panel-2);
             padding: .1em .35em; }
  .md pre { background: var(--panel); padding: 12px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: .55em 0; padding: .1em 1em; border-left: 3px solid var(--line);
                   color: var(--muted); }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 1.1em 0; }
  .md table { border-collapse: collapse; margin: .7em 0; display: block; overflow-x: auto; }
  .md table th, .md table td { border: 1px solid var(--line); padding: 5px 10px; }
  .md table th { background: var(--panel-2); }

  pre.raw { font: 13px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

  /* ---- diff ---- */
  .diffbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 12px; }
  select, button {
    font: 12.5px var(--mono); background: var(--bg); color: var(--text);
    border: 1px solid var(--line); padding: 5px 9px;
  }
  button { cursor: pointer; } button:hover { border-color: var(--blue); }
  pre.diff { font: 12.5px/1.5 var(--mono); margin: 0; overflow-x: auto; white-space: pre; }
  pre.diff .a { color: var(--green); } pre.diff .d { color: var(--red); }
  pre.diff .h { color: var(--blue); } pre.diff .c { color: var(--muted); }
  .dl { display: inline-block; margin-top: 6px; }

  /* ---- timeline view ---- */
  .tl-ctls { display: flex; gap: 16px; align-items: center; padding: 6px 2px 8px; color: var(--muted); font-size: 12.5px; position: relative; }
  .tl-ctls label { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  .tl-ctls label:hover { color: var(--text); }
  .tl-ctls input[type="checkbox"] { accent-color: var(--blue); margin: 0; }
  .tl-ctls svg { vertical-align: -2px; }
  .tl-wrap { display: flex; border: 1px solid var(--line); background: var(--panel); height: calc(100vh - 132px); min-height: 320px; }
  .tl-labels { flex: 0 0 250px; position: relative; border-right: 1px solid var(--line); overflow: hidden; }
  .tl-labels-inner { position: relative; width: 100%; }
  .tl-lab { position: absolute; left: 0; width: 100%; padding: 0 10px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
  .tl-lab:hover { background: var(--panel-2); }
  .tl-lab .nm { font: 11.5px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-lab .nm .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--c); }
  .tl-lab .mt { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-lab.dim-idle { opacity: .45; }
  .tl-lab.sel { background: var(--panel-2); outline: 1px solid var(--blue); outline-offset: -1px; }
  #tl-msgbar { display: none; gap: 10px; align-items: center; padding: 8px 2px 0; }
  #tl-msgbar #tl-selcount { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #tl-msgbar input { flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 6px 10px; font-size: 12.5px; }
  #tl-msgbar input:focus { outline: none; border-color: var(--blue); }
  #tl-msgbar button { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
  #tl-msgbar button:hover { border-color: var(--blue); }
  #tl-msgbar #tl-msgstatus { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tl-wrap.editing { height: calc(100vh - 176px); }
  .tl-glab { position: absolute; left: 0; width: 100%; padding: 0 10px; display: flex; align-items: flex-end; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--c); cursor: pointer; }
  .tl-glab:hover { text-decoration: underline; }
  .tl-glab.drag-src { opacity: .4; }
  .tl-glab.drop-hint { border-top: 2px solid var(--blue); }
  .tl-gband { fill: #10161f; }
  .tl-lband { position: absolute; left: 0; width: 100%; background: #10161f; }
  .tl-gstrip { position: absolute; left: 0; width: 3px; background: var(--c); }
  .tl-scroller { overflow: auto; position: relative; flex: 1; cursor: grab; }
  .tl-scroller.drag { cursor: grabbing; }
  .tl-scroller svg { display: block; }
  .tl-scroller svg text { font-family: var(--sans); }
  #tl-legend-btn { margin-left: auto; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; }
  #tl-legend-btn:hover { color: var(--text); text-decoration: underline; }
  #tl-legend-pop { position: absolute; right: 0; top: calc(100% + 2px); z-index: 35; display: none; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; }
  #tl-legend-pop .lrow { display: flex; gap: 9px; align-items: center; color: var(--muted); font-size: 12px; padding: 2.5px 0; white-space: nowrap; }
  #tl-legend-pop .lrow svg { flex: none; }
  .tl-grid { stroke: var(--line-soft); }
  .tl-grid.major { stroke: var(--line); }
  .tl-dayline { stroke: var(--line); stroke-width: 1.6; }
  .tl-axbg { fill: var(--panel); }
  .tl-axline { stroke: var(--line); }
  .tl-tlab { fill: var(--muted); font-size: 11px; }
  .tl-dlab { fill: var(--text); font-size: 11.5px; font-weight: 600; }
  .tl-wkend { fill: var(--panel-2); }
  .tl-rowhit { fill: transparent; }
  .tl-bar { fill: var(--panel); stroke: var(--c); stroke-width: 1.2; cursor: pointer; }
  .tl-bar:hover { stroke-width: 2; }
  .tl-idle { stroke: var(--c); stroke-width: 1.1; stroke-dasharray: 2 4; opacity: .5; }
  .tl-killx { fill: var(--c); font-size: 11px; font-weight: 700; }
  .tl-live { fill: var(--c); }
  .tl-ev-u { fill: var(--panel); stroke: var(--c); stroke-width: 2; }
  .tl-ev-m { fill: var(--c); }
  .tl-hit { fill: transparent; cursor: pointer; }
  .tl-edge line { stroke: var(--green); stroke-width: 1.2; }
  .tl-edge path { fill: var(--green); }
  .tl-now { stroke: var(--red); stroke-width: 1.2; }
  .tl-nowlab { fill: var(--red); font-size: 10.5px; }
  .tl-dim { opacity: .13; }
  #tl-tip { position: fixed; display: none; max-width: 400px; z-index: 30; background: var(--panel); border: 1px solid var(--line); padding: 9px 12px; pointer-events: none; }
  #tl-tip.pinned { pointer-events: auto; border-color: var(--muted); }
  #tl-tip .t1 { font: 11px var(--mono); color: var(--muted); margin-bottom: 3px; }
  #tl-tip .t1 b { color: var(--text); font-weight: 600; }
  #tl-tip .t2 { font-size: 12.5px; line-height: 1.45; }
  #tl-tip a { display: inline-block; margin-top: 6px; font-size: 12px; }

  /* ---- timeline drawer + context menu ---- */
  #tl-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(660px, 58vw); z-index: 25; background: var(--bg); border-left: 1px solid var(--line); display: none; flex-direction: column; }
  #tl-drawer.open { display: flex; }
  .tl-dhead { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tl-dhead b { color: var(--text); font: 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-dhead .muted { font-size: 11px; white-space: nowrap; }
  #tl-ddetail { font-size: 12px; white-space: nowrap; }
  #tl-dfilter { margin-left: auto; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 4px 9px; font-size: 12px; width: 150px; }
  #tl-dfilter:focus { outline: none; border-color: var(--blue); }
  #tl-dclose { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
  #tl-dclose:hover { color: var(--text); }
  #tl-dbody { overflow-y: auto; flex: 1; padding: 8px 0 30px; }
  .tl-crow { display: grid; grid-template-columns: 84px 1fr; gap: 10px; padding: 5px 14px; border-left: 3px solid transparent; }
  .tl-crow time { color: var(--dim); font: 10.5px var(--mono); padding-top: 2px; white-space: nowrap; }
  .tl-crow .ct { font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .tl-cr-u { border-left-color: var(--blue); background: var(--panel-2); }
  .tl-cr-u .ct { color: var(--text); }
  .tl-cr-p { border-left-color: var(--green); }
  .tl-cr-s .ct { color: var(--dim); font-style: italic; font-size: 11.5px; }
  .tl-cr-x .ct { color: var(--muted); font: 11px var(--mono); }
  .tl-cr-hl { outline: 2px solid var(--amber); outline-offset: -2px; }
  .tl-dreply { display: none; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  #tl-drawer.can-reply .tl-dreply { display: flex; }
  #tl-dinput { flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 6px 10px; font-size: 12.5px; }
  #tl-dinput:focus { outline: none; border-color: var(--blue); }
  #tl-dsend { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
  #tl-dsend:hover { border-color: var(--blue); }
  #tl-dstatus { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #tl-dstatus:empty { display: none; }
  #tl-menu { position: fixed; z-index: 40; min-width: 210px; background: var(--panel); border: 1px solid var(--line); display: none; padding: 3px 0; }
  #tl-menu .mi { padding: 7px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tl-menu .mi:hover { background: var(--panel-2); }
  #tl-menu .sep { border-top: 1px solid var(--line-soft); margin: 3px 0; }
</style>
</head>
<body>
<header>
  <span class="brand"><span class="glyph">◈</span> tx-ide</span>
  <nav class="tabs">
    <a id="tab-chats" href="#/">chats</a>
    <a id="tab-artifacts" href="#/artifacts">artifacts</a>
    <a id="tab-timeline" href="#/timeline">timeline</a>
  </nav>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="filter…" autocomplete="off">
  <span id="hot-window" title="hot window — a session interacted with inside it gets a green name and surfaces out of collapsed trees">
    <span class="hot-label"><b>hot</b> &lt;</span>
    <input id="hot-value" type="number" min="1" step="1" autocomplete="off">
    <select id="hot-unit"><option value="min">min</option><option value="h">h</option></select>
  </span>
  <a class="muted" id="nav-refresh" style="font-size:13px">↻</a>
</header>
<main id="app"><div class="empty">loading…</div></main>

<script>
"use strict";
const app = document.getElementById("app");
const searchBox = document.getElementById("search");
const tabChats = document.getElementById("tab-chats");
const tabArtifacts = document.getElementById("tab-artifacts");
const tabTimeline = document.getElementById("tab-timeline");
const hotWindowControl = document.getElementById("hot-window");
const hotValueInput = document.getElementById("hot-value");
const hotUnitSelect = document.getElementById("hot-unit");

// ---- helpers ----
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Short-lived request memo: the auto-refresh tick fetches a view's payloads to fingerprint them,
// then re-renders through route() — the memo makes that second read free instead of a double fetch.
const _fetchCache = new Map();  // url -> {at, promise}
const FETCH_REUSE_MS = 2000;
async function getJSON(url, fresh) {
  const hit = _fetchCache.get(url);
  if (!fresh && hit && Date.now() - hit.at < FETCH_REUSE_MS) return hit.promise;
  const promise = (async () => {
    const r = await fetch(url);
    if (!r.ok) { let j = {}; try { j = await r.json(); } catch (e) {} throw new Error(j.error || ("HTTP " + r.status)); }
    return r.json();
  })();
  _fetchCache.set(url, { at: Date.now(), promise });
  try { return await promise; }
  catch (e) { _fetchCache.delete(url); throw e; }
}
function shortId(id) { return id && id.length > 12 ? id.slice(0, 8) : (id || ""); }
function fmtBytes(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}
function fmtTs(epoch) {
  if (!epoch) return "";
  const d = new Date(epoch * 1000), now = new Date();
  const hm = d.toTimeString().slice(0, 5);
  if (d.toDateString() === now.toDateString()) return hm;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + hm;
}
function chips(tags, colors) {
  return (tags || []).map(t => {
    const color = (colors && colors[t]) || "var(--dim)";
    return '<span class="chip" style="--chip:' + esc(color) + '">' + esc(t) + "</span>";
  }).join("");
}
// Group chip for any row carrying the server's group triple.
function groupChip(row) {
  if (!row.resolved_group) return "";
  const how = row.group ? "explicit override" : "derived from lineage";
  return '<span class="chip gchip" style="--chip:' + esc(row.group_color || "var(--dim)") +
    '" title="effort group (' + how + ')">⊙ ' + esc(row.resolved_group) + "</span>";
}
function stateHtml(state) {
  return '<span class="state st-' + esc(state) + '"><span class="dot"></span>' + esc(state) + "</span>";
}
function sessionLink(id, name, exists) {
  if (!exists) return '<span class="mono" title="' + esc(id) + '">' + esc(name) + "</span>";
  return '<a class="mono" href="#/chats/' + esc(id) + '" title="' + esc(id) + '">' + esc(name) + "</a>";
}

// ---- a compact, self-contained markdown renderer (no external libs) ----
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) =>
    '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>");
  return s;
}
function renderMarkdown(text) {
  const lines = text.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  const listOpen = []; // stack of "ul"/"ol"
  function closeLists() { while (listOpen.length) out.push("</" + listOpen.pop() + ">"); }
  while (i < lines.length) {
    let line = lines[i];
    // fenced code block
    const fence = line.match(/^```(.*)$/);
    if (fence) {
      closeLists(); i++;
      const buf = [];
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; // closing fence
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    // horizontal rule
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeLists(); out.push("<hr>"); i++; continue; }
    // heading
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeLists(); const n = h[1].length; out.push("<h" + n + ">" + inline(h[2]) + "</h" + n + ">"); i++; continue; }
    // pipe table: header row followed by a |---|--- separator
    if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]+$/.test(lines[i + 1])) {
      closeLists();
      const cells = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
      const head = cells(line);
      i += 2;
      let t = "<table><thead><tr>" + head.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
      while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim() !== "") {
        t += "<tr>" + cells(lines[i]).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>"; i++;
      }
      out.push(t + "</tbody></table>");
      continue;
    }
    // blockquote (consume consecutive)
    if (/^\s*>\s?/.test(line)) {
      closeLists(); const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote>" + renderMarkdown(buf.join("\n")) + "</blockquote>");
      continue;
    }
    // list items
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      const kind = ul ? "ul" : "ol";
      if (listOpen[listOpen.length - 1] !== kind) { closeLists(); out.push("<" + kind + ">"); listOpen.push(kind); }
      out.push("<li>" + inline((ul || ol)[1]) + "</li>"); i++; continue;
    }
    // blank line
    if (line.trim() === "") { closeLists(); i++; continue; }
    // paragraph (gather until a blank / block boundary)
    closeLists();
    const para = [line]; i++;
    while (i < lines.length && lines[i].trim() !== "" &&
           !/^(#{1,6}\s|```|\s*>|\s*[-*+]\s|\s*\d+\.\s|\s*(-{3,}|\*{3,})\s*$)/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    out.push("<p>" + inline(para.join(" ")) + "</p>");
  }
  closeLists();
  return out.join("\n");
}

// ---- search (client-side filter over the current list) + subtree collapse ----
// Collapse works like Notion sub-items: a parent row's chevron folds its whole subtree; everything
// starts collapsed; the expanded set persists. A non-empty search overrides collapse — matches
// surface wherever they nest — and clearing it restores the folded view.
let filterables = [];   // [{row: <tr>, text: lowercased haystack}]
const EXPAND_KEY = "txide-chats-expanded";
let expanded = new Set();
try { expanded = new Set(JSON.parse(localStorage.getItem(EXPAND_KEY) || "[]")); } catch (e) {}
function applyFilter() {
  const needle = searchBox.value.trim().toLowerCase();
  for (const item of filterables) {
    const anchor = item.row.dataset.promo;   // set on a promoted (hot, out-of-place) row
    const ancestors = item.row.dataset.anc ? item.row.dataset.anc.split(" ") : [];
    let show;
    if (needle !== "") {
      // Search shows real positions only — a promoted duplicate would double every match.
      show = !anchor && item.text.includes(needle);
    } else if (anchor) {
      // A promoted row shows exactly while its anchor is the visible collapsed ancestor.
      show = !expanded.has(anchor) && ancestors.every(id => expanded.has(id));
    } else {
      show = ancestors.every(id => expanded.has(id));
    }
    item.row.hidden = !show;
  }
}
searchBox.addEventListener("input", applyFilter);
function bindFilter(tbody) {
  filterables = Array.from(tbody.rows).map(row => ({ row, text: row.textContent.toLowerCase() }));
  applyFilter();
}
function toggleSubtree(id, tbody) {
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  localStorage.setItem(EXPAND_KEY, JSON.stringify([...expanded]));
  tbody.querySelectorAll('.gut[data-id="' + id + '"] .tgl').forEach(t => {
    t.textContent = expanded.has(id) ? "▾" : "▸";
  });
  applyFilter();
}

// ---- hot window ----
// How recent a session's last interaction must be to count as "hot" — green name, promotion out
// of collapsed trees (renderChats). Number + unit in the header, persisted like the fold state;
// the default matches the previously hardcoded one hour.
const HOT_KEY = "txide-chats-hot-window";
let hotWindow = { value: 1, unit: "h" };
try {
  const saved = JSON.parse(localStorage.getItem(HOT_KEY) || "null");
  if (saved && Number.isInteger(saved.value) && saved.value >= 1 &&
      (saved.unit === "min" || saved.unit === "h")) hotWindow = saved;
} catch (e) {}
function hotWindowSeconds() { return hotWindow.value * (hotWindow.unit === "h" ? 3600 : 60); }
function syncHotControl() { hotValueInput.value = hotWindow.value; hotUnitSelect.value = hotWindow.unit; }
syncHotControl();
// Applies live on every valid edit. An invalid number (empty, 0, junk) is never persisted; the
// "change" commit (blur/Enter) snaps the field back to the last good value instead. The re-render
// must be explicit — the auto-refresh tick fingerprints server payloads only.
function applyHotWindow(commit) {
  const value = Math.round(Number(hotValueInput.value));
  if (hotValueInput.value.trim() === "" || !Number.isFinite(value) || value < 1) {
    if (commit) syncHotControl();
    return;
  }
  if (value !== hotWindow.value || hotUnitSelect.value !== hotWindow.unit) {
    hotWindow = { value, unit: hotUnitSelect.value };
    localStorage.setItem(HOT_KEY, JSON.stringify(hotWindow));
    route();
  } else if (commit) syncHotControl();
}
hotValueInput.addEventListener("input", () => applyHotWindow(false));
hotValueInput.addEventListener("change", () => applyHotWindow(true));
hotUnitSelect.addEventListener("change", () => applyHotWindow(false));

// ---- chats list ----
// The list is a forest: a session spawned from another session (record `parent`) indents under it.
// Ordering standard: a family sorts by its subtree's NEWEST interaction (a subsession update
// bubbles its ancestors up, like a mail thread sorting by newest message); siblings sort by their
// own subtree recency.
function sessionForest(sessions) {
  const byId = new Map(sessions.map(s => [s.id, s]));
  const children = new Map();
  const roots = [];
  for (const s of sessions) {
    if (s.parent && byId.has(s.parent) && s.parent !== s.id) {
      if (!children.has(s.parent)) children.set(s.parent, []);
      children.get(s.parent).push(s);
    } else roots.push(s);
  }
  const subtreeLast = s => {
    const kids = children.get(s.id) || [];
    return Math.max(s.last_epoch, ...kids.map(subtreeLast));
  };
  const flat = [];
  const walk = (list, depth, root, ancestors) => {
    list.sort((a, b) => subtreeLast(b) - subtreeLast(a));
    for (const s of list) {
      flat.push({
        s, depth, root: root || s, ancestors, driver: false, familyDriver: null,
        hasChildren: children.has(s.id),
      });
      walk(children.get(s.id) || [], depth + 1, root || s, [...ancestors, s.id]);
    }
  };
  walk(roots, 0, null, []);
  // Per family: the row whose own time IS the subtree's newest — the one that lifted the tree to
  // its list position. Mark it, and hand the root its time so the sort key is visible up top.
  const byRoot = new Map();
  for (const entry of flat) {
    if (!byRoot.has(entry.root.id)) byRoot.set(entry.root.id, []);
    byRoot.get(entry.root.id).push(entry);
  }
  for (const family of byRoot.values()) {
    const driver = family.reduce((a, b) => (b.s.last_epoch > a.s.last_epoch ? b : a));
    if (driver.s.id === family[0].s.id) continue;   // the root itself is the newest — nothing to explain
    driver.driver = true;
    family[0].familyDriver = driver.s;
  }
  return flat;
}

async function renderChats() {
  setNav("chats", true);
  app.innerHTML = '<div class="empty">loading…</div>';
  let data;
  try { data = await getJSON("/api/chats"); }
  catch (e) { app.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }
  if (!data.sessions.length) { app.innerHTML = '<div class="empty">No chat sessions recorded yet.</div>'; return; }
  const now = Date.now() / 1000;
  const isHot = s => now - s.last_epoch < hotWindowSeconds();
  const entries = sessionForest(data.sessions);
  // Hot descendants per ancestor: a nested session with interaction inside the hot window gets one
  // PROMOTED row under every ancestor; visibility rules make exactly the one under the visible
  // collapsed ancestor show, so a folded tree surfaces the session responsible for its freshness.
  const promotedByAnchor = new Map();
  for (const entry of entries) {
    if (!entry.ancestors.length || !isHot(entry.s)) continue;
    for (const ancestorId of entry.ancestors) {
      if (!promotedByAnchor.has(ancestorId)) promotedByAnchor.set(ancestorId, []);
      promotedByAnchor.get(ancestorId).push(entry);
    }
  }

  const cells = (s, last) =>
    '<td>' + groupChip(s) + chips(s.tags, s.tag_colors) + '</td>' +
    '<td>' + stateHtml(s.state) + '</td>' +
    '<td class="muted mono" style="font-size:12px">' + esc(s.engine) + '</td>' +
    '<td class="right num">' + s.chats + '</td>' +
    '<td class="right">' + (s.artifacts
      ? '<span class="num">' + s.artifacts + "</span>"
      : '<span class="num zero">—</span>') + '</td>' +
    '<td class="right muted mono" style="font-size:12px">' + last + '</td>';

  const rows = entries.map(({ s, depth, ancestors, driver, familyDriver, hasChildren }) => {
    const indent = '<span style="display:inline-block;width:' + depth * 22 + 'px"></span>';
    // Parents: indent + chevron wrapped in one fat clickable gutter. Leaves: plain spacers.
    const gutter = hasChildren
      ? '<span class="gut" data-id="' + esc(s.id) + '" title="fold/unfold">' + indent +
        '<span class="tgl">' + (expanded.has(s.id) ? "▾" : "▸") + "</span></span>"
      : indent + '<span class="tgl-spacer"></span>';
    let last = esc(s.last_ago);
    if (familyDriver) {
      last = '<span class="fresh" title="newest in this tree: ' + esc(familyDriver.name) + '">' +
        esc(familyDriver.last_ago) + '</span> <span class="own">· ' + esc(s.last_ago) + "</span>";
    } else if (driver) {
      last = '<span class="fresh" title="newest in this tree — keeps it at this position">' + last + "</span>";
    }
    const hot = ancestors.length && isHot(s);
    let html = '<tr class="rowlink" data-href="#/chats/' + esc(s.id) + '"' +
      (ancestors.length ? ' data-anc="' + ancestors.map(esc).join(" ") + '"' : "") + '>' +
      '<td>' + gutter +
      '<b' + (hot ? ' class="hot"' : "") + '>' + esc(s.name) + '</b></td>' + cells(s, last) + "</tr>";
    // Promoted duplicates of this node's hot descendants, right below it — shown only while this
    // node is the visible collapsed ancestor (applyFilter), so they never coexist with the real rows.
    for (const hotEntry of (promotedByAnchor.get(s.id) || []).slice().sort((a, b) => b.s.last_epoch - a.s.last_epoch)) {
      const anchorAncestors = hotEntry.ancestors.slice(0, hotEntry.ancestors.indexOf(s.id));
      html += '<tr class="rowlink" data-href="#/chats/' + esc(hotEntry.s.id) + '"' +
        ' data-promo="' + esc(s.id) + '"' +
        (anchorAncestors.length ? ' data-anc="' + anchorAncestors.map(esc).join(" ") + '"' : "") + '>' +
        '<td><span style="display:inline-block;width:' + (depth + 1) * 22 + 'px"></span>' +
        '<span class="tgl-spacer"></span>' +
        '<b class="hot" title="active ' + esc(hotEntry.s.last_ago) + ' ago inside this tree — expand ▸ to see its place">' +
        esc(hotEntry.s.name) + "</b></td>" +
        cells(hotEntry.s, '<span class="fresh">' + esc(hotEntry.s.last_ago) + "</span>") + "</tr>";
    }
    return html;
  }).join("");
  app.innerHTML =
    '<table class="grid"><thead><tr>' +
    '<th>session</th><th>group · tags</th><th>state</th><th>engine</th>' +
    '<th class="right">chats</th><th class="right">artifacts</th><th class="right">last</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
  const tbody = app.querySelector("tbody");
  tbody.addEventListener("click", e => {
    const gutter = e.target.closest(".gut");
    if (gutter) { toggleSubtree(gutter.dataset.id, tbody); return; }
    const row = e.target.closest("tr[data-href]");
    if (row && !e.target.closest("a")) location.hash = row.dataset.href.slice(1);
  });
  bindFilter(tbody);
}

      '<td style="font-size:13px">' + origin + '</td>' +
      '<td class="muted mono" style="font-size:12px">' + esc(c.started_ago) + ' ago</td>' +
      '<td>' + status + '</td>' +
      '<td class="muted mono" style="font-size:11.5px">' + esc(src.join(" · ") || "no source on disk") + '</td></tr>';

  const notes = d.notes.map(n =>

    '<section><div class="props">' +

    "</section>" +

    '<section><h2>Chats · ' + d.chats.length + '</h2><table class="grid"><thead><tr>' +
    '<th>#</th><th>role</th><th>chat</th><th>origin</th><th>started</th><th>status</th><th>source</th>' +

    (d.artifacts.length ?

    (d.notes.length ? '<section><h2>Notes · ' + d.notes.length + "</h2>" + notes + "</section>" : "") +

    '<section><h2>Conversation</h2><div id="conv"><div id="convLoad">loading full history…</div></div></section>';

  return loadConversation(id, d);
}

async function loadConversation(id, detail) {
  const conv = document.getElementById("conv");
  let data;
  try { data = await getJSON("/api/chats/" + encodeURIComponent(id) + "/dialogue"); }
  catch (e) { conv.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }
  if (location.hash !== "#/chats/" + id) return;   // user navigated away meanwhile
  const parts = [];
  data.chats.forEach((chat, index) => {
    const label = detail.chats[index] || {};
    parts.push('<div class="chat-sep"><b>chat ' + (index + 1) + "</b>" +
      '<span>' + esc(chat.role) + "</span>" +
      (chat.id ? '<span title="' + esc(chat.id) + '">' + esc(shortId(chat.id)) + "</span>" : "") +
      (label.started_ago ? "<span>started " + esc(label.started_ago) + " ago</span>" : "") +
      (chat.source ? "<span>source: " + esc(chat.source) + "</span>" : "") +
      "<span>" + chat.turns.length + " turns</span></div>");
    if (!chat.source) {
      parts.push('<div class="muted" style="padding:10px 0">no transcript on disk for this chat.</div>');
      return;
    }
    for (const turn of chat.turns) {
      if (turn.who === "tools") {
        const names = (turn.names || []).slice(0, 4).join(", ");
        parts.push('<div class="turn tools">· ' + turn.count + " tool call" + (turn.count === 1 ? "" : "s") +
                   (names ? " — " + esc(names) : "") + " ·</div>");
      } else if (turn.who === "you") {
        parts.push('<div class="turn you"><span class="who">you</span><span class="ts">' + fmtTs(turn.ts) +
                   '</span><div class="body">' + esc(turn.text) + "</div></div>");
      } else {
        parts.push('<div class="turn agent"><span class="who">agent</span><span class="ts">' + fmtTs(turn.ts) +
                   '</span><div class="body md">' + renderMarkdown(turn.text) + "</div></div>");
      }
    }
  });
  conv.innerHTML = parts.join("") || '<div class="muted">no conversation recorded.</div>';
}

      '<td class="mono muted" style="font-size:12px">' + esc(a.filename) + '</td>' +
      '<td class="right num">' + a.revs + '</td>' +
      '<td>' + authors + '</td>' +
      '<td class="right muted mono" style="font-size:12px">' + esc(a.updated_ago) + ' ago</td></tr>';
  }).join("");
  app.innerHTML =
    '<table class="grid"><thead><tr>' +
    '<th>artifact</th><th>group</th><th>file</th><th class="right">revs</th><th>authors</th><th class="right">updated</th>' +

  tbody.addEventListener("click", e => {
    const row = e.target.closest("tr[data-href]");

}

// ---- artifact detail ----
async function renderArtifactDetail(id) {
  setNav("artifacts", false);
  app.innerHTML = '<div class="empty">loading…</div>';
  let d;
  try { d = await getJSON("/api/artifacts/" + encodeURIComponent(id)); }
  catch (e) { app.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }

  const w = d.working;
  let working;
  if (w.encoding === "markdown") working = '<div class="md">' + renderMarkdown(w.text) + "</div>";
  else if (w.encoding === "text") working = '<pre class="raw">' + esc(w.text) + "</pre>";
  else working = '<p class="muted">Binary content (' + w.size + ' bytes).</p>' +
    '<a class="dl" href="/api/artifacts/' + encodeURIComponent(id) + '/raw">↓ download ' + esc(d.filename) + "</a>";

  const rows = d.history.map(t =>
    '<tr><td class="num">r' + t.rev + '</td>' +
    '<td>' + sessionLink(t.session_id, t.actor, t.session_exists) + '</td>' +
    '<td class="muted mono" style="font-size:12px">' + esc(t.ago) + ' ago</td>' +
    '<td class="muted" style="font-size:13px">' + (t.changes ? esc(t.changes) : "—") + "</td></tr>").join("");

  const opts = d.history.map(t => '<option value="' + t.rev + '">rev ' + t.rev + "</option>").join("");
  const defA = Math.max(0, d.revs - 2), defB = d.revs - 1;
  const dirty = d.dirty ? ' <span class="badge">working copy dirty — unsnapshotted edits</span>' : "";

  app.innerHTML =
    '<div class="crumbs"><a href="#/artifacts">artifacts</a> / <span>' + esc(shortId(d.id)) + "</span></div>" +
    '<h1 class="doc">' + esc(d.title || d.filename) + "</h1>" +
    '<p class="subhead"><span class="mono" style="font-size:12px">' + esc(d.id) + '</span><br>' +
    '<span class="mono">' + esc(d.filename) + '</span> · ' + d.revs + ' revision' + (d.revs === 1 ? "" : "s") +
    ' · created ' + esc(d.created_ago) + ' ago · updated ' + esc(d.updated_ago) + " ago" +
    ' · ' + groupChip(d) + dirty + "</p>" +

    '<section><h2>Touched by</h2><table class="grid"><thead><tr>' +
    '<th>rev</th><th>session</th><th>when</th><th>changes</th>' +
    '</tr></thead><tbody>' + rows + "</tbody></table></section>" +

    '<section><h2>Working copy</h2><div style="padding-top:8px">' + working + "</div></section>" +

    (d.revs > 1 ?
      '<section><h2>Diff revisions</h2>' +
      '<div class="diffbar"><select id="ra">' + opts + '</select><span class="muted">→</span>' +
      '<select id="rb">' + opts + '</select><button id="dodiff">compare</button></div>' +
      '<pre class="diff" id="diffout"><span class="c">pick two revisions and press compare</span></pre>' +
      "</section>"
      : "");

  if (d.revs > 1) {
    document.getElementById("ra").value = defA;
    document.getElementById("rb").value = defB;
    document.getElementById("dodiff").onclick = () => runDiff(id);
    runDiff(id);
  }
}

async function runDiff(id) {
  const a = document.getElementById("ra").value, b = document.getElementById("rb").value;
  const out = document.getElementById("diffout");
  out.innerHTML = '<span class="c">computing…</span>';
  let r;
  try { r = await getJSON("/api/artifacts/" + encodeURIComponent(id) + "/diff?a=" + a + "&b=" + b); }
  catch (e) { out.innerHTML = '<span class="d">' + esc(e.message) + "</span>"; return; }
  if (r.error) { out.innerHTML = '<span class="d">' + esc(r.error) + "</span>"; return; }
  if (!r.diff) { out.innerHTML = '<span class="c">(no differences between rev ' + a + " and rev " + b + ")</span>"; return; }
  out.innerHTML = r.diff.split("\n").map(line => {
    const cls = line.startsWith("+") ? "a" : line.startsWith("-") ? "d" :
                line.startsWith("@@") ? "h" : "c";
    return '<span class="' + cls + '">' + esc(line) + "</span>";
  }).join("\n");
}


// ---- timeline view ----
// Swimlanes over /api/timeline. All wall-clock rendering is CLIENT-side and local-timezone: the
// payload is clock-free (fingerprint-stable while the store is quiet), the now-line runs on a 1s
// timer, and the refresh tick re-renders only when the data actually changed. View state (zoom,
// scroll, pinned tip) lives in TL and survives those re-renders.
const TL = { pph: null, sl: 0, st: 0, dragging: false, pinId: null, pinAt: null, fitted: false, follow: false, edit: false, sel: new Set(), drawer: { sid: null, t: null, filter: "", draft: "", stick: true, top: 0 } };
try { TL.activeOnly = localStorage.getItem("txide-tl-active-only") === "1"; } catch (e) { TL.activeOnly = false; }
try { TL.showSys = localStorage.getItem("txide-tl-show-sys") === "1"; } catch (e) { TL.showSys = false; }
try { TL.showU = localStorage.getItem("txide-tl-show-u") !== "0"; TL.showM = localStorage.getItem("txide-tl-show-m") !== "0"; TL.showE = localStorage.getItem("txide-tl-show-e") !== "0"; TL.showB = localStorage.getItem("txide-tl-show-b") !== "0"; } catch (e) { TL.showU = TL.showM = TL.showE = TL.showB = true; }
const TL_PADL = 14, TL_PADR = 46, TL_AXH = 46, TL_LANE = 30, TL_GH = 22, TL_GGAP = 12, TL_PADB = 14;
const TL_NOWPAD = 48;   // px of future visible right of the now line — the horizontal scroll clamp
const TL_WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
let tlData = null, tlTips = [], tlVisKey = "", tlClockTimer = null, tlDayLabelEls = [], tlRowYs = {}, tlBands = [], tlDragGroup = null;

function tlActive() { const h = location.hash.replace(/^#/, ""); return h === "/timeline" || h.startsWith("/timeline/"); }
function tlNow() { return (Date.now() - tlData.epoch_ms) / 60000; }
function tlEnd() { return Math.max(tlData.t1, tlNow()) + 10; }
function tlMaxScroll(sc) { return Math.max(0, tlX(tlNow()) + TL_NOWPAD - sc.clientWidth); }
function tlX(t) { return TL_PADL + t / 60 * TL.pph; }
function tlTAt(px) { return (px - TL_PADL) * 60 / TL.pph; }
function tlDate(t) { return new Date(tlData.epoch_ms + t * 60000); }
function tlHM(t) { const d = tlDate(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function tlDayHM(t) { const d = tlDate(t); return TL_WD[d.getDay()] + " " + tlHM(t); }
function tlEl(id) { return document.getElementById(id); }

function tlVisible() {
  const sc = tlEl("tl-scroller");
  const tA = tlTAt(sc.scrollLeft), tB = tlTAt(sc.scrollLeft + sc.clientWidth);
  const now = tlNow();
  return tlData.sessions.map((s, i) => ({ s, si: i })).filter(o => {
    if (!TL.showSys && o.s.sys) return false;
    const end = o.s.kill != null ? o.s.kill : now;
    return s0Start(o.s) <= tB && end >= tA;
  }).map(o => {
    // idle-in-view uses the same segment tier the bars render at this zoom
    const segs = TL.pph >= 60 && o.s.fsegs ? o.s.fsegs : o.s.segs;
    const activeIn = segs.some(g => g[0] <= tB && g[1] >= tA);
    const evIn = o.s.ev.some(e => e[0] >= tA && e[0] <= tB);
    return { s: o.s, si: o.si, dim: !activeIn && !evIn };
  }).filter(o => !TL.activeOnly || !o.dim);
}
function s0Start(s) { return s.segs.length ? s.segs[0][0] : s.a; }

// Lanes blocked by v6 resolved group, groups ordered by first activity. Every group gets its
// header — even a single visible lane — so membership is always explicit.
function tlLayoutRows(vis) {
  const rows = [], bands = [];
  let y = TL_AXH, gi = 0;
  for (const g of tlData.groups) {
    const members = vis.filter(v => v.s.g === g.k);
    if (!members.length) continue;
    const y0 = y;
    rows.push({ type: "g", g: g.k, color: g.color, y });
    y += TL_GH;
    for (const v of members) { rows.push({ type: "s", v, g, y }); y += TL_LANE; }
    bands.push({ k: g.k, y0, y1: y, color: g.color, zebra: gi % 2 === 1 });
    y += TL_GGAP;
    gi++;
  }
  return { rows, bands, H: y - TL_GGAP + TL_PADB };
}
function tlTickSteps() {
  if (TL.pph >= 1200) return [5, 15];
  if (TL.pph >= 400) return [10, 30];
  if (TL.pph >= 150) return [30, 60];
  if (TL.pph >= 60) return [60, 180];
  if (TL.pph >= 20) return [180, 360];
  return [360, 720];
}

function tlRender() {
  const sc = tlEl("tl-scroller"), svg = tlEl("tl-svg"), labels = tlEl("tl-labels-inner");
  if (!sc || !tlData) return;
  const vis = tlVisible();
  const { rows, bands, H } = tlLayoutRows(vis);
  const now = tlNow(), W = Math.round(tlX(tlEnd()) + TL_PADR);
  const [minor, major] = tlTickSteps();
  tlTips = []; tlRowYs = {};
  const idxCy = {};
  let o = "";
  for (const d of tlData.days) {
    if (!d.wk) continue;
    const x0 = tlX(Math.max(d.o, 0)), x1 = tlX(Math.min(d.o + 1440, tlEnd()));
    if (x1 > x0) o += `<rect class="tl-wkend" x="${x0}" y="${TL_AXH - 14}" width="${x1 - x0}" height="${H - TL_AXH + 8}"/>`;
  }
  for (const b of bands)
    if (b.zebra) o += `<rect class="tl-gband" x="0" y="${b.y0}" width="${W}" height="${b.y1 - b.y0}"/>`;
  for (let m = 0; m <= tlEnd(); m += minor) {
    if (((m % 1440) + 1440) % 1440 === 0) continue;
    const X = tlX(m), isMaj = m % major === 0;
    o += `<line class="tl-grid${isMaj ? " major" : ""}" x1="${X}" y1="${TL_AXH - 14}" x2="${X}" y2="${H - 4}"/>`;
  }
  for (const d of tlData.days)
    if (d.o >= 0) o += `<line class="tl-dayline" x1="${tlX(d.o)}" y1="4" x2="${tlX(d.o)}" y2="${H - 4}"/>`;
  // lanes
  for (const row of rows) {
    if (row.type !== "s") continue;
    const { s, si, dim } = row.v, g = row.g, cy = row.y + TL_LANE / 2;
    // zoomed in (>=60 px/h) the fine 10-min idle tier applies; the overview keeps the 3 h tier
    const segsArr = TL.pph >= 60 && s.fsegs ? s.fsegs : s.segs;
    tlRowYs[s.sid] = cy;
    idxCy[si] = cy;
    o += `<g style="--c:${g.color}"${dim ? ' opacity=".45"' : ""} data-lane="${si}" data-hay="${esc((s.id + " " + s.g + " " + s.meta + " " + s.blurb).toLowerCase())}">`;
    o += `<rect class="tl-rowhit" x="0" y="${row.y}" width="${W}" height="${TL_LANE}"/>`;
    if (TL.showB) {   // the lane body: bars, idle dots, × — off = dots-only view
      const lastEnd = segsArr.length ? segsArr[segsArr.length - 1][1] : s.a;
      const xe = tlX(s.kill != null ? s.kill : now);
      const idles = [];   // every silent stretch: between activity runs, then the tail to ×/now
      for (let gi = 0; gi + 1 < segsArr.length; gi++)
        idles.push([tlX(segsArr[gi][1]) + 4, tlX(segsArr[gi + 1][0]) - 4]);
      idles.push([tlX(lastEnd) + 4, xe - 7]);
      for (const [ix1, ix2] of idles)
        if (ix2 > ix1 + 3) o += `<line class="tl-idle" x1="${ix1}" y1="${cy}" x2="${ix2}" y2="${cy}"/>`;
      if (s.kill != null) o += `<text class="tl-killx" x="${Math.max(xe - 4, tlX(lastEnd) + 2)}" y="${cy + 4}">×</text>`;
      for (const seg of segsArr) {
        let x1 = tlX(seg[0]), x2 = tlX(seg[1]);
        if (x2 - x1 < 6) x2 = x1 + 6;
        o += `<rect class="tl-bar" data-open="${s.sid}" x="${x1}" y="${cy - 7}" width="${x2 - x1}" height="14"/>`;
      }
    }
    let px = -99, flip = 1;
    for (const e of s.ev) {
      if (e[1] === "u" ? !TL.showU : !TL.showM) continue;
      const X = tlX(e[0]);
      let dy = 0;
      if (X - px < 9) { dy = 6 * flip; flip = -flip; } else flip = 1;
      px = X;
      const i = tlTips.length;
      tlTips.push({ title: `${tlDayHM(e[0])} — ${s.id}`, body: e[2], sid: s.sid, t: e[0], k: e[1] });
      if (e[1] === "u") o += `<circle class="tl-ev-u" cx="${X}" cy="${cy + dy}" r="4.6"/>`;
      else o += `<path class="tl-ev-m" d="M ${X} ${cy + dy - 5.2} L ${X + 5.2} ${cy + dy} L ${X} ${cy + dy + 5.2} L ${X - 5.2} ${cy + dy} Z"/>`;
      o += `<circle class="tl-hit" data-i="${i}"${e[3] ? ` data-aid="${e[3]}"` : ""} cx="${X}" cy="${cy + dy}" r="9"/>`;
    }
    o += "</g>";
  }
  // peer-message edges: vertical arrow at send time, sender lane -> receiver lane.  A sender
  // with no lane (tx-assistant, out of window) or one culled from the current layout degrades
  // to a short stub dropping into the receiver.
  if (TL.showE) {
    for (const [m, f, tIdx, token, snip, kind] of tlData.edges || []) {
      const toCy = idxCy[tIdx];
      if (toCy == null || f === tIdx) continue;
      const X = tlX(m);
      const fromCy = f >= 0 ? idxCy[f] : null;
      const fromName = f >= 0 ? tlData.sessions[f].id : token;
      const toS = tlData.sessions[tIdx];
      const verb = kind === "spawn" ? " · spawned" : kind === "resume" ? " · resumed" : "";
      const i = tlTips.length;
      tlTips.push({ title: `${fromName} → ${toS.id}${verb} · ${tlDayHM(m)}`, body: snip || (kind !== "msg" ? toS.blurb : ""), sid: toS.sid, t: m, k: "p" });
      let y1, dir;
      if (fromCy != null) { dir = fromCy < toCy ? 1 : -1; y1 = fromCy + dir * 9; }
      else { dir = 1; y1 = toCy - 20; }
      const y2 = toCy - dir * 10;
      o += `<g class="tl-edge"><line x1="${X}" y1="${y1}" x2="${X}" y2="${y2}"/>` +
           `<path d="M ${X} ${toCy - dir * 4} L ${X - 3.5} ${y2} L ${X + 3.5} ${y2} Z"/>` +
           `<circle class="tl-hit" data-i="${i}" cx="${X}" cy="${y2}" r="8"/></g>`;
    }
  }
  // sticky axis strip: an opaque band that tracks scrollTop (translated in the scroll handler)
  o += `<g id="tl-axis"><rect class="tl-axbg" x="0" y="0" width="${W}" height="${TL_AXH - 14}"/>`;
  o += `<line class="tl-axline" x1="0" y1="${TL_AXH - 14}" x2="${W}" y2="${TL_AXH - 14}"/>`;
  for (let m = 0; m <= tlEnd(); m += major)
    if (((m % 1440) + 1440) % 1440 !== 0) o += `<text class="tl-tlab" x="${tlX(m) + 3}" y="${TL_AXH - 20}">${tlHM(m)}</text>`;
  for (const d of tlData.days)
    o += `<text class="tl-dlab" data-o="${d.o}" x="${tlX(Math.max(d.o, 0)) + 6}" y="16">${esc(d.label)}</text>`;
  o += "</g>";
  // now marker: repositioned by the 1s clock without a re-render
  o += `<g id="tl-nowg"><line class="tl-now" x1="${tlX(now)}" y1="18" x2="${tlX(now)}" y2="${H - 4}"/>`;
  o += `<text class="tl-nowlab" x="${tlX(now) + 5}" y="${TL_AXH - 2}">now</text>`;
  for (const row of rows) {
    if (row.type !== "s" || !row.v.s.live || !TL.showB) continue;
    const cy = row.y + TL_LANE / 2;
    o += `<path class="tl-live" style="--c:${row.g.color}" data-cy="${cy}" d="M ${tlX(now) + 4} ${cy - 4.5} L ${tlX(now) + 10.5} ${cy} L ${tlX(now) + 4} ${cy + 4.5} Z"/>`;
  }
  o += "</g>";
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = o;
  labels.style.height = H + "px";
  let lo = "";
  for (const b of bands) {
    if (b.zebra) lo += `<div class="tl-lband" style="top:${b.y0}px;height:${b.y1 - b.y0}px"></div>`;
    lo += `<div class="tl-gstrip" style="--c:${b.color};top:${b.y0}px;height:${b.y1 - b.y0}px;background:var(--c)"></div>`;
  }
  for (const row of rows) {
    if (row.type === "g") {
      lo += `<div class="tl-glab" draggable="true" style="--c:${row.color};top:${row.y}px;height:${TL_GH - 3}px;color:var(--c)" data-g="${esc(row.g)}">${esc(row.g)}</div>`;
      continue;
    }
    const { s, si, dim } = row.v;
    const meta = s.meta;
    lo += `<div class="tl-lab${dim ? " dim-idle" : ""}${TL.sel.has(s.sid) ? " sel" : ""}" data-si="${si}" data-sid="${s.sid}" data-hay="${esc((s.id + " " + s.g + " " + s.meta + " " + s.blurb).toLowerCase())}" style="--c:${row.g.color};top:${row.y}px;height:${TL_LANE}px">` +
          `<span class="nm"><span class="dot"></span>${esc(s.id)}</span><span class="mt">${esc(meta)}</span></div>`;
  }
  labels.innerHTML = lo;
  tlBands = bands;
  tlDayLabelEls = Array.from(svg.querySelectorAll(".tl-dlab"));
  tlEl("tl-labelsbox").scrollTop = sc.scrollTop;
  tlSyncScroll();
  tlApplySearch();
  tlReanchorPin();
}

// day labels clamp to the viewport's left edge (calendar-style), axis band follows scrollTop
function tlSyncScroll() {
  const sc = tlEl("tl-scroller");
  if (!sc) return;
  const axis = tlEl("tl-axis");
  if (axis) axis.setAttribute("transform", `translate(0 ${sc.scrollTop})`);
  const nowg = tlEl("tl-nowg");
  for (const el of tlDayLabelEls) {
    const dayO = +el.dataset.o;
    const dayEndX = tlX(Math.min(dayO + 1440, tlEnd()));
    el.setAttribute("x", Math.min(Math.max(tlX(Math.max(dayO, 0)), sc.scrollLeft) + 6, dayEndX - 70));
  }
}

function tlMaybeRelayout() {
  if (TL.dragging) return;   // lanes popping in/out mid-drag is disorienting — settle on release
  const vis = tlVisible();
  const key = vis.map(v => v.si + (v.dim ? "~" : "")).join("|");
  if (key !== tlVisKey) { tlVisKey = key; tlRender(); }
}

function tlTipShow(html, cx, cy, pin) {
  const tip = tlEl("tl-tip");
  if (!tip) return;
  tip.innerHTML = html;
  tip.style.display = "block";
  tip.classList.toggle("pinned", !!pin);
  const r = tip.getBoundingClientRect();
  let L = cx + 14, T = cy + 14;
  if (L + r.width > innerWidth - 8) L = cx - r.width - 12;
  if (T + r.height > innerHeight - 8) T = cy - r.height - 12;
  tip.style.left = Math.max(4, L) + "px";
  tip.style.top = Math.max(4, T) + "px";
}
function tlShowTip(i, cx, cy, pin) {
  const d = tlTips[i];
  if (!d) return;
  const link = pin ? `<a href="#" data-quick="1">quick view ›</a> &nbsp;·&nbsp; <a href="#/chats/${d.sid}">detail →</a>` : "";
  tlTipShow(`<div class="t1"><b>${esc(d.title)}</b>${d.k === "u" ? " · you" : ""}</div><div class="t2">${esc(d.body)}</div>${link}`, cx, cy, pin);
  if (pin) { TL.pinId = { sid: d.sid, t: d.t, k: d.k }; TL.pinAt = { x: cx, y: cy }; }
}
function tlHideTip() {
  const tip = tlEl("tl-tip");
  if (tip) { tip.style.display = "none"; tip.classList.remove("pinned"); }
  TL.pinId = null;
}
// A pinned tip survives data-driven re-renders by identity, not index.
function tlReanchorPin() {
  if (!TL.pinId) return;
  const i = tlTips.findIndex(d => d.sid === TL.pinId.sid && d.t === TL.pinId.t && d.k === TL.pinId.k);
  if (i < 0) tlHideTip();
  else tlShowTip(i, TL.pinAt.x, TL.pinAt.y, true);
}

// ---- group drag&drop reordering ----
function tlHoveredBlock(e) {
  const inner = tlEl("tl-labels-inner");
  const y = e.clientY - inner.getBoundingClientRect().top;
  for (const b of tlBands) if (y < b.y1) return b.k;
  return null;   // below every block
}
// Coarse-block insertion: hovering a block below the dragged group means AFTER it, above means
// BEFORE it — direction decides, so a one-slot move works wherever inside the block you drop.
// Returns the group to insert before, null for "move to end", undefined for a no-op.
function tlInsertBefore(src, hovered) {
  if (!hovered) return null;
  const keys = tlData.groups.map(g => g.k);
  const s = keys.indexOf(src), t = keys.indexOf(hovered);
  if (s < 0 || t < 0 || s === t) return undefined;
  return t > s ? (keys[t + 1] !== undefined ? keys[t + 1] : null) : hovered;
}
async function tlReorderGroup(src, before) {
  if (!src || src === before) return;
  const order = tlData.groups.map(g => g.k).filter(k => k !== src);
  const at = before ? order.indexOf(before) : order.length;
  order.splice(at < 0 ? order.length : at, 0, src);
  const byK = {};
  for (const g of tlData.groups) byK[g.k] = g;
  tlData.groups = order.map(k => byK[k]);
  tlVisKey = "";
  tlRender();                                   // optimistic — the saved order returns on the next tick
  try {
    await fetch("/api/timeline/order", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ order }),

async function tlDrawerSend() {

  const key = TL.drawer.sid, target = TL.drawer.target || key;

function tlClockTick() {
  if (!tlActive() || !tlData || !tlEl("tl-svg")) return;
  const now = tlNow();
  if (tlX(now) > +tlEl("tl-svg").getAttribute("width") - TL_PADR + 30) { tlRender(); return; }
  const nowg = tlEl("tl-nowg");
  if (!nowg) return;
  const line = nowg.querySelector(".tl-now"), lab = nowg.querySelector(".tl-nowlab");
  line.setAttribute("x1", tlX(now)); line.setAttribute("x2", tlX(now));
  lab.setAttribute("x", tlX(now) + 5);

function tlSetZoom(np, anchor) {
  const sc = tlEl("tl-scroller");
  np = Math.max(4, Math.min(6000, np));   // 6000 px/h ≈ a 15-minute span across the viewport
  if (anchor == null) anchor = sc.clientWidth / 2;
  const t = tlTAt(sc.scrollLeft + anchor);
  TL.pph = np; tlVisKey = "";
  tlRender();
  sc.scrollLeft = TL.follow ? tlMaxScroll(sc) : Math.min(tlX(t) - anchor, tlMaxScroll(sc));

// ---- drawer (quick view) ----
// The prototype's right-hand conversation panel, fed lazily by /api/timeline/<sid>/dialogue.
// Open state rides in the hash (#/timeline/<sid>) so it deep-links, survives refresh-tick
// re-renders, and closes with back/Esc. While the viewer sits at the bottom, live appends
// keep it pinned there (chat-app tailing); scrolled up, position is preserved.
async function tlRenderDrawer() {

    return;
  }
  if (TL.drawer.sid !== sid || !tlEl("tl-drawer")) return;   // closed or navigated mid-fetch
  dw.classList.add("open");
  tlEl("tl-dtitle").textContent = d.name;
  tlEl("tl-dmeta").textContent = d.meta + " · " + d.rows.length + " entries";
  tlEl("tl-ddetail").href = "#/chats/" + d.sid;
  tlEl("tl-dfilter").value = TL.drawer.filter;
  // reply only reaches a live pane — a dead lane keeps the read-only drawer. `d.sid` is the
  // lane's PRIMARY record (a deep-linked hash may carry an older id of the merged chain), so it
  // is both the liveness lookup and the send target.
  TL.drawer.target = d.sid;

  if (TL.drawer.focusOnOpen) {

    if (!l) return;
    e.preventDefault();
    tlShowMenu(e.clientX, e.clientY, tlMenuFor(+l.dataset.si));
  });
  tlEl("tl-tip").addEventListener("click", e => {
    const q = e.target.closest("[data-quick]");
    if (!q || !TL.pinId) return;
    e.preventDefault();
    const pin = TL.pinId;
    tlHideTip();
    tlOpenDrawer(pin.sid, pin.k === "lane" ? null : pin.t);
  });
  // the focus restore must come LAST: the input's container (drawer / edit bar) is only
  // displayed again by the wiring above, and focus() on a display:none element is a no-op
  if (keep) {
    const el = tlEl(keep.id);
    if (el) { el.value = keep.v; el.focus({ preventScroll: true }); el.setSelectionRange(keep.s, keep.e); }
  }
  if (!tlClockTimer) tlClockTimer = setInterval(tlClockTick, 1000);
  tlRenderDrawer();
}
document.addEventListener("keydown", e => {
  if (!tlActive()) return;
  // ↑/↓ walk the drawer through the lanes in their on-screen order — but never while a draft is
  // being composed (a switch resets the drawer state) or while another input holds the caret
  if ((e.key === "ArrowUp" || e.key === "ArrowDown") && TL.drawer.sid && tlData) {
    const ae = document.activeElement;
    if (ae && ae.tagName === "INPUT" && (ae.id !== "tl-dinput" || ae.value)) return;
    const sids = tlLayoutRows(tlVisible()).rows.filter(r => r.type === "s").map(r => r.v.s.sid);
    if (!sids.length) return;
    const here = TL.drawer.target || TL.drawer.sid;
    const cur = sids.indexOf(here);
    const next = cur < 0
      ? (e.key === "ArrowDown" ? 0 : sids.length - 1)
      : (cur + (e.key === "ArrowDown" ? 1 : -1) + sids.length) % sids.length;
    e.preventDefault();
    if (sids[next] !== here) tlOpenDrawer(sids[next], null);
    return;
  }
  if (e.key !== "Escape") return;
  const menu = tlEl("tl-menu");
  if (menu && menu.style.display === "block") return tlHideMenu();
  if (TL.pinId) return tlHideTip();
  if (TL.edit) { TL.edit = false; TL.sel.clear(); tlRender(); tlSyncEdit(); return; }
  if (TL.drawer.sid) {
    const inp = tlEl("tl-dinput");
    // a half-typed reply: the first Escape only leaves the box (draft kept), the next closes
    if (inp && document.activeElement === inp && inp.value) return inp.blur();
    location.hash = "/timeline";
  }
});
document.addEventListener("click", () => {
  tlHideMenu();
  const lpop = tlEl("tl-legend-pop");
  if (lpop && lpop.classList.contains("pin")) { lpop.classList.remove("pin"); lpop.style.display = "none"; }
});

// ---- routing ----
function setNav(tab, isList) {
  tabChats.classList.toggle("active", tab === "chats");
  tabArtifacts.classList.toggle("active", tab === "artifacts");
  tabTimeline.classList.toggle("active", tab === "timeline");
  searchBox.classList.toggle("hidden", !isList);
  hotWindowControl.classList.toggle("hidden", !(tab === "chats" && isList));
  if (!isList) filterables = [];
}
const UUID_RE = /^[0-9a-fA-F-]{36}$/;
function route() {
  const hash = location.hash.replace(/^#/, "");
  if (hash.startsWith("/chats/")) return renderChatDetail(hash.slice("/chats/".length));
  if (hash === "/timeline" || hash.startsWith("/timeline/")) return renderTimeline(hash.startsWith("/timeline/") ? decodeURIComponent(hash.slice("/timeline/".length)) : null);
  if (hash === "/artifacts") return renderArtifacts();
  if (hash.startsWith("/artifacts/")) return renderArtifactDetail(hash.slice("/artifacts/".length));
  if (hash.startsWith("/") && UUID_RE.test(hash.slice(1))) return renderArtifactDetail(hash.slice(1)); // legacy links
  return renderChats();
}
document.getElementById("nav-refresh").onclick = route;
window.addEventListener("hashchange", route);
route();

// ---- auto refresh ----
// A 5s tick re-fetches the current view's payloads, fingerprints them with the volatile relative-age
// strings stripped, and re-renders only on a real change (or once a minute, so the ages tick).
// Scroll, open folds, and diff picks survive the swap; a hidden tab pauses and resyncs on focus;
// an active text selection defers the tick so a copy in progress is never stomped.
const REFRESH_MS = 5000, FORCE_AGE_REFRESH_EVERY = 12;
function viewUrls() {
  const hash = location.hash.replace(/^#/, "");
  if (hash.startsWith("/chats/")) {
    const id = encodeURIComponent(hash.slice("/chats/".length));
    return ["/api/chats/" + id, "/api/chats/" + id + "/dialogue"];
  }
  if (hash === "/timeline" || hash.startsWith("/timeline/")) {
    const urls = ["/api/timeline"];
    if (hash.startsWith("/timeline/")) urls.push("/api/timeline/" + encodeURIComponent(hash.slice("/timeline/".length)) + "/dialogue");
    return urls;
  }
  if (hash === "/artifacts") return ["/api/artifacts"];
  if (hash.startsWith("/artifacts/")) return ["/api/artifacts/" + encodeURIComponent(hash.slice("/artifacts/".length))];
  if (hash.startsWith("/") && UUID_RE.test(hash.slice(1))) return ["/api/artifacts/" + hash.slice(1)];
  return ["/api/chats"];
}
const stripVolatile = (k, v) => (k === "ago" || k.endsWith("_ago") ? undefined : v);
let lastFingerprint = "", tickCount = 0, refreshing = false;
async function refreshTick() {
  if (refreshing || document.hidden) return;
  const selection = getSelection();
  if (selection && !selection.isCollapsed && app.contains(selection.anchorNode)) return;
  refreshing = true;
  try {
    const urls = viewUrls();
    const datas = await Promise.all(urls.map(u => getJSON(u, true)));
    if (viewUrls().join() !== urls.join()) return;   // navigated away mid-fetch
    const fingerprint = JSON.stringify(datas, stripVolatile);
    tickCount++;
    const force = tickCount % FORCE_AGE_REFRESH_EVERY === 0;
    if (fingerprint === lastFingerprint && !force) return;
    lastFingerprint = fingerprint;
    const scroll = { x: scrollX, y: scrollY };
    const openFolds = Array.from(document.querySelectorAll("details[open] summary")).map(s => s.textContent);
    const diff = document.getElementById("ra")
      ? { a: document.getElementById("ra").value, b: document.getElementById("rb").value } : null;
    await route();
    document.querySelectorAll("details summary").forEach(s => {
      if (openFolds.includes(s.textContent)) s.parentElement.open = true;
    });
    if (diff && document.getElementById("ra")) {
      document.getElementById("ra").value = diff.a;
      document.getElementById("rb").value = diff.b;
      document.getElementById("dodiff").click();
    }
    scrollTo(scroll.x, scroll.y);
  } catch (e) {
    // transient fetch failure — the next tick retries
  } finally {
    refreshing = false;
  }
}
setInterval(refreshTick, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshTick(); });
window.addEventListener("hashchange", () => { lastFingerprint = ""; });
</script>
