<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tx-ide · chats & artifacts</title>
<style>
  /* Palette mirrors the analytics house style (polymarket dashboard). Deliberately plain: flat
     colors only — no gradients, no alpha, no blur, no rounding, no shadows. */
  :root {
    color-scheme: dark;
    --bg: #080b10; --panel: #0e131b; --panel-2: #121923; --line: #253044; --line-soft: #18202e;
    --text: #edf3fb; --muted: #8290a5; --dim: #3d5273;
    --blue: #5ca8ff; --green: #48d597; --red: #ff7085; --amber: #ffcb6b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text); font: 14px/1.55 var(--sans); min-height: 100vh;
  }
  a { color: var(--blue); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }

  /* ---- header ---- */
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px;
    padding: 12px 28px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .2px; color: var(--text); }
  .brand .glyph { color: var(--blue); }
  nav.tabs { display: inline-flex; gap: 16px; }
  nav.tabs a { color: var(--muted); font-size: 13px; }
  nav.tabs a:hover { color: var(--text); text-decoration: none; }
  nav.tabs a.active { color: var(--text); }
  header .spacer { flex: 1; }
  #search {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 5px 10px; width: 220px; font: 13px var(--sans);
  }
  #search:focus { outline: none; border-color: var(--blue); }
  #search.hidden { display: none; }
  /* Hot-window control: number + unit picking the freshness threshold renderChats reads. */
  #hot-window { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #hot-window.hidden { display: none; }
  #hot-window .hot-label { color: var(--muted); font-size: 12.5px; }
  #hot-window .hot-label b { color: var(--green); font-weight: 600; }
  #hot-window input {
    width: 56px; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 5px 4px 5px 8px; font: 12.5px var(--mono);
  }
  #hot-window input:focus { outline: none; border-color: var(--blue); }

  main { width: 100%; padding: 22px 28px 80px; }

  /* ---- chips / badges / state dots ---- */
  /* Tag chips exactly as the sessions-graph dashboard draws them: per-tag color (the terminal
     picker's tag_cube palette, served as --chip), pill outline, 16% tinted fill. */
  /* Effort-group chip (⊙, dashed outline, no fill) — reads distinct from tag chips. */
  .chip.gchip { background: transparent; border-style: dashed; }
  .chip {
    display: inline-block; margin-right: 6px; font-size: 10.5px; padding: 1px 6px;
    border-radius: 999px; color: var(--chip, var(--dim)); border: 1px solid var(--chip, var(--dim));
    background: color-mix(in srgb, var(--chip, var(--dim)) 16%, transparent);
    white-space: nowrap;
  }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px;
         background: var(--dim); vertical-align: 1px; }
  .st-working  .dot { background: var(--green); }
  .st-waiting  .dot { background: var(--blue); }
  .st-idle     .dot { background: var(--muted); }
  .st-alive    .dot { background: var(--green); }
  .st-exited   .dot { background: var(--dim); }
  .st-archived .dot { background: var(--amber); }
  .state { white-space: nowrap; color: var(--muted); font-size: 12.5px; }
  .badge { color: var(--amber); font-size: 12px; }
  .num { font-family: var(--mono); font-size: 12.5px; }
  .num.zero { color: var(--dim); }

  /* ---- grid tables (Notion-style rows) ---- */
  table.grid { width: 100%; border-collapse: collapse; }
  .grid th {
    text-align: left; font: 600 10.5px var(--mono); text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted); padding: 8px 10px;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .grid td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: baseline; }
  .grid tbody tr.rowlink { cursor: pointer; }
  .grid tbody tr.rowlink:hover { background: var(--panel); }
  .grid .right { text-align: right; }
  /* Notion-style sub-item toggle: parents get a chevron that folds their subtree; leaves get an
     equal-width spacer so names align. The whole gutter (indent + chevron) is the hit target,
     fattened to the full row height and pulled flush to the row's left edge (the negative margins
     swallow the cell padding), so folding never mis-clicks into the session detail. */
  .tgl, .tgl-spacer { display: inline-block; width: 24px; text-align: center; font-family: var(--mono); }
  .gut {
    display: inline-block; cursor: pointer;
    padding: 12px 2px 12px 10px; margin: -12px -2px -12px -10px;
  }
  /* The glyph box spans [10,34] inside a visible block running 0→34 (row edge to name); shifting
     it 5px left puts the triangle on the block's optical center. */
  .gut .tgl { color: var(--muted); position: relative; left: -5px; }
  .gut:hover { background: var(--panel-2); }
  .gut:hover .tgl { color: var(--text); }
  /* The visible sort key: a family orders by its subtree's newest interaction, so the root shows
     that time in green beside its own dim age, and the descendant that produced it carries the
     same green time — matching values connect the pair. */
  .fresh { color: var(--green); }
  .own { color: var(--dim); }
  /* A hot session (interaction inside the header's hot window) nested in a tree: green name —
     both when promoted under a collapsed ancestor and at its true position once the tree is
     expanded. */
  .grid b.hot { color: var(--green); }
  .empty { color: var(--muted); text-align: center; padding: 70px 0; }
  .err { color: var(--red); font-family: var(--mono); font-size: 13px; }

  /* ---- detail layout ---- */
  .crumbs { font-size: 13px; margin-bottom: 14px; color: var(--muted); }
  h1.doc { font-size: 21px; margin: 0 0 2px; font-weight: 650; }
  .subhead { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; max-width: 84ch; }
  section { margin: 30px 0; }
  section > h2 {
    font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .9px;
    color: var(--muted); margin: 0 0 4px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
  }
  .props { display: grid; grid-template-columns: 175px 1fr; font-size: 13.5px; }
  .props > div { padding: 6px 0; border-bottom: 1px solid var(--line-soft); overflow-wrap: anywhere; }
  .props .k { color: var(--muted); }
  details.fold summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 6px 0; }
  details.fold summary:hover { color: var(--text); }
  pre.cmd {
    font: 12px/1.5 var(--mono); background: var(--panel);
    padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0;
  }

  /* ---- conversation ---- */
  .chat-sep {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 26px 0 4px; padding-top: 8px; border-top: 1px solid var(--line);
    font: 12px var(--mono); color: var(--muted);
  }
  .chat-sep b { color: var(--text); font-weight: 600; }
  .turn { padding: 10px 0 2px; }
  .turn .who { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .9px; }
  .turn.you .who { color: var(--blue); }
  .turn.agent .who { color: var(--green); }
  .turn .ts { color: var(--dim); font: 10.5px var(--mono); margin-left: 8px; }
  .turn .body { max-width: 110ch; }   /* full-width page; prose keeps a readable measure */
  .turn.you .body {
    white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 0;
    border-left: 2px solid var(--line); padding-left: 12px;
  }
  .turn.agent .body { margin: 4px 0 0; }
  .turn.tools { color: var(--dim); font: 11px var(--mono); padding: 6px 0; }
  #convLoad { color: var(--muted); font: 12px var(--mono); padding: 14px 0; }

  /* ---- rendered markdown ---- */
  /* A document scale, not a UI scale: space ABOVE a heading is what makes a section read as one, so
     the headings carry generous leading margins and tight trailing ones. Artifacts are dense with
     bold lead-ins and inline code, so `strong` brightens and `code` stays quiet — a loud code chip
     on every third word turns a plan into confetti. */
  /* `break-word`, NOT `anywhere`: `anywhere` also shrinks min-content to a single character, which
     lets table auto-layout squeeze a column until `CANCELLED_PLANNING` wraps as `CANCELL/ED_PL/ANNING`.
     `break-word` still rescues a token too long for its own line without licensing that. */
  .md { overflow-wrap: break-word; font-size: 14.5px; line-height: 1.68; }
  .md > :first-child { margin-top: 0; }
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6 { line-height: 1.25; font-weight: 650; color: var(--text); }
  .md h1 { font-size: 1.55em; margin: 1.4em 0 .5em; letter-spacing: -.012em; }
  .md h2 { font-size: 1.28em; margin: 2.1em 0 .55em; padding-bottom: .28em;
           border-bottom: 1px solid var(--line); }
  .md h3 { font-size: 1.08em; margin: 1.9em 0 .4em; }
  .md h4 { font-size: .84em; margin: 2em 0 .4em; color: var(--muted);
           text-transform: uppercase; letter-spacing: .09em; }
  .md h5,.md h6 { font-size: .9em; margin: 1.5em 0 .35em; color: var(--muted); }
  .md p { margin: .9em 0; }
  .md strong { color: #ffffff; font-weight: 650; }
  .md em { color: var(--text); }
  .md del { color: var(--dim); }
  .md a { text-decoration: underline; text-underline-offset: 2px; }
  .md ul,.md ol { margin: .9em 0; padding-left: 1.6em; }
  .md li { margin: .34em 0; }
  .md li::marker { color: var(--dim); }
  .md li > ul,.md li > ol { margin: .34em 0; }
  .md li > p { margin: .5em 0; }
  .md code { font-family: var(--mono); font-size: .855em; color: #a9c6e8;
             background: var(--panel-2); padding: .08em .3em; }
  .md pre { background: var(--panel); border-left: 2px solid var(--line); margin: 1.1em 0;
            padding: 12px 15px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; }
  .md pre code { background: none; padding: 0; color: var(--text); font-size: inherit; }
  .md blockquote { margin: 1.1em 0; padding: .15em 0 .15em 1.1em; border-left: 2px solid var(--dim);
                   color: var(--muted); }
  .md blockquote > :first-child { margin-top: 0; }
  .md blockquote > :last-child { margin-bottom: 0; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 2.2em 0; }
  .md img { max-width: 100%; }
  /* The SCROLLER is the wrapper, not the table: a `display: block` table shrink-wraps to the
     container and squeezes its columns, where a wrapper lets the table take the width it needs. */
  .md .tablewrap { overflow-x: auto; margin: 1.2em 0; }
  .md table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: .93em; }
  .md table th, .md table td { border: 1px solid var(--line); padding: 6px 11px;
                               text-align: left; vertical-align: top; }
  .md table th { background: var(--panel-2); font-weight: 600; white-space: nowrap; }

  pre.raw { font: 13px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

  /* ---- diff ---- */
  select, button {
    font: 12.5px var(--mono); background: var(--bg); color: var(--text);
    border: 1px solid var(--line); padding: 5px 9px;
  }
  button { cursor: pointer; } button:hover { border-color: var(--blue); }
  pre.diff { font: 12.5px/1.5 var(--mono); margin: 0; overflow-x: auto; white-space: pre; }
  pre.diff .a { color: var(--green); } pre.diff .d { color: var(--red); }
  pre.diff .h { color: var(--blue); } pre.diff .c { color: var(--muted); }
  pre.diff .s { color: var(--dim); font-style: italic; }
  .dl { display: inline-block; margin-top: 6px; }

  /* ---- artifact reader ---- */
  /* One full-height panel in the timeline's `.tl-wrap` shape: a fixed index rail, the document, and
     a rail that switches between the document's OUTLINE and its REVISIONS. A full-height app view
     wants no page scroll under it, so `body.full` drops main's bottom padding. */
  body.full main { padding-bottom: 22px; }
  .av-wrap { display: flex; border: 1px solid var(--line); background: var(--panel);
             height: calc(100vh - 112px); min-height: 340px; }
  .av-wrap.norail .av-rail { display: none; }
  .av-wrap.noindex .av-index { display: none; }

  /* index rail — the artifact list, banded by effort group like the timeline's lane groups.
     `min-width: 0` throughout: a flex item defaults to `min-width: auto`, so one nowrap plan title
     would push a fixed-basis rail as wide as its longest line and eat the document's measure. */
  .av-index { flex: 0 0 268px; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .av-ifilter { padding: 8px; border-bottom: 1px solid var(--line); flex: none; }
  .av-ifilter input { width: 100%; background: var(--panel-2); border: 1px solid var(--line);
                      color: var(--text); padding: 5px 9px; font: 12.5px var(--sans); }
  .av-ifilter input:focus { outline: none; border-color: var(--blue); }
  .av-ilist { overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .av-gband { display: flex; align-items: center; gap: 7px; padding: 13px 10px 5px; min-width: 0;
              font: 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--c);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .av-gband::before { content: ""; flex: none; width: 3px; height: 11px; background: var(--c); }
  .av-row { padding: 5px 10px 6px 21px; cursor: pointer; border-left: 3px solid transparent; }
  .av-row:hover { background: var(--panel-2); }
  .av-row.sel { background: var(--panel-2); border-left-color: var(--blue); }
  .av-row .t { display: block; font-size: 12.5px; color: var(--text);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av-row.sel .t { color: var(--blue); }
  .av-row .m { font: 10.5px var(--mono); color: var(--dim); }
  .av-kind { display: inline-block; font: 9.5px var(--mono); text-transform: uppercase;
             color: var(--muted); border: 1px solid var(--line); padding: 0 3px; margin-right: 5px; }

  /* document pane */
  .av-doc { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .av-dhead { display: flex; align-items: center; gap: 9px; flex: none;
              padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  /* the title is the only header item allowed to give ground — everything else keeps its size */
  .av-dhead > * { flex: none; }
  .av-dhead .ti { flex: 1 1 auto; min-width: 60px; font-size: 13.5px; font-weight: 600;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .av-dhead .sub { font: 11px var(--mono); color: var(--dim); white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
  .av-acts { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
  .av-btn { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
            font: 11.5px var(--mono); padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .av-btn:hover { color: var(--text); border-color: var(--blue); text-decoration: none; }
  .av-btn.on { color: var(--blue); border-color: var(--blue); }
  /* A two-state control shows BOTH states with the live one lit — a single button labelled with
     either the current mode or the action it would take reads ambiguously. */
  .av-seg { display: inline-flex; border: 1px solid var(--line); }
  .av-seg span { padding: 3px 8px; font: 11.5px var(--mono); color: var(--dim); cursor: pointer; }
  .av-seg span:hover { color: var(--text); }
  .av-seg span.on { background: var(--bg); color: var(--blue); cursor: default; }
  .av-find { display: none; align-items: center; gap: 9px; flex: none; padding: 6px 14px;
             border-bottom: 1px solid var(--line); background: var(--panel); }
  .av-doc.finding .av-find { display: flex; }
  .av-find input { width: 300px; background: var(--panel-2); border: 1px solid var(--line);
                   color: var(--text); padding: 4px 9px; font-size: 12.5px; }
  .av-find input:focus { outline: none; border-color: var(--blue); }
  .av-find .n { font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
  mark.av-hit { background: color-mix(in srgb, var(--amber) 32%, transparent); color: var(--text); }
  mark.av-hit.cur { background: var(--amber); color: #10161f; }
  .av-body { flex: 1; overflow-y: auto; padding: 24px 0 120px; }
  .av-page { max-width: 90ch; margin: 0 auto; padding: 0 30px; }
  .av-page.wide-page { max-width: none; }
  /* Artifacts are prose, not code: a unified diff wraps rather than scrolling sideways, and the
     hanging indent keeps every continuation clear of the +/- marker column. */
  .av-page pre.diff { white-space: pre-wrap; overflow-wrap: anywhere; }
  .av-page pre.diff span { display: block; padding-left: 1.4em; text-indent: -1.4em; }

  /* right rail — outline | revisions */
  .av-rail { flex: 0 0 262px; min-width: 0; display: flex; flex-direction: column;
             border-left: 1px solid var(--line); background: var(--panel); }
  .av-rtabs { display: flex; flex: none; border-bottom: 1px solid var(--line); }
  .av-rtab { flex: 1; text-align: center; padding: 7px 0; cursor: pointer; user-select: none;
             font: 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .av-rtab:hover { color: var(--text); }
  .av-rtab.on { color: var(--blue); box-shadow: inset 0 -2px 0 var(--blue); }
  .av-rbody { overflow-y: auto; flex: 1; padding: 6px 0 26px; }
  .av-toc a { display: block; padding: 3px 12px 3px 0; font-size: 12px; color: var(--muted);
              border-left: 2px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .av-toc a:hover { color: var(--text); background: var(--panel-2); text-decoration: none; }
  .av-toc a.on { color: var(--blue); border-left-color: var(--blue); background: var(--panel-2); }
  .av-toc a.l1 { padding-left: 11px; color: var(--text); font-weight: 600; }
  .av-toc a.l2 { padding-left: 23px; }
  .av-toc a.l3 { padding-left: 36px; font-size: 11.5px; }
  .av-toc a.l4 { padding-left: 49px; font-size: 11.5px; color: var(--dim); }
  .av-rev { display: grid; grid-template-columns: 40px 1fr; gap: 8px; padding: 6px 11px 7px;
            cursor: pointer; border-left: 3px solid transparent; }
  .av-rev:hover { background: var(--panel-2); }
  .av-rev.on { background: var(--panel-2); border-left-color: var(--blue); }
  .av-rev.cmp { background: var(--panel-2); border-left-color: var(--amber); }
  .av-rev .r { font: 11.5px var(--mono); color: var(--muted); }
  .av-rev.on .r { color: var(--blue); } .av-rev.cmp .r { color: var(--amber); }
  .av-rev .who { font: 10.5px var(--mono); color: var(--muted);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av-rev .ago { font: 10px var(--mono); color: var(--dim); }
  .av-rev .ch { font-size: 11px; line-height: 1.42; color: var(--muted); margin-top: 2px;
                display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .av-rhint { padding: 9px 12px; font-size: 11px; line-height: 1.5; color: var(--dim);
              border-bottom: 1px solid var(--line-soft); }

  /* side-by-side diff */
  table.av-sbs { width: 100%; border-collapse: collapse; table-layout: fixed; font: 12px/1.5 var(--mono); }
  .av-sbs td { padding: 0 8px; vertical-align: top; white-space: pre-wrap; overflow-wrap: anywhere; }
  .av-sbs col.cn { width: 42px; }
  .av-sbs td.ln { text-align: right; color: var(--dim); font-size: 10.5px;
                  user-select: none; background: var(--panel); }
  .av-sbs td.gut { border-left: 1px solid var(--line); }
  .av-sbs tr.add td.rt, .av-sbs tr.chg td.rt { background: color-mix(in srgb, var(--green) 15%, transparent); }
  .av-sbs tr.del td.lt, .av-sbs tr.chg td.lt { background: color-mix(in srgb, var(--red) 15%, transparent); }
  .av-sbs tr.skip td { padding: 4px 8px; font-size: 11px; font-style: italic;
                       color: var(--dim); background: var(--panel); }

  /* ---- timeline view ---- */
  .tl-ctls { display: flex; gap: 16px; align-items: center; padding: 6px 2px 8px; color: var(--muted); font-size: 12.5px; position: relative; }
  .tl-ctls label { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  .tl-ctls label:hover { color: var(--text); }
  .tl-ctls input[type="checkbox"] { accent-color: var(--blue); margin: 0; }
  .tl-ctls svg { vertical-align: -2px; }
  .tl-wrap { display: flex; border: 1px solid var(--line); background: var(--panel); height: calc(100vh - 132px); min-height: 320px; }
  .tl-labels { flex: 0 0 250px; position: relative; border-right: 1px solid var(--line); overflow: hidden; }
  .tl-labels-inner { position: relative; width: 100%; }
  .tl-lab { position: absolute; left: 0; width: 100%; padding: 0 10px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
  .tl-lab:hover { background: var(--panel-2); }
  .tl-lab .nm { font: 11.5px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-lab .nm .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--c); }
  .tl-lab .mt { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-lab.dim-idle { opacity: .45; }
  .tl-lab.sel { background: var(--panel-2); outline: 1px solid var(--blue); outline-offset: -1px; }
  #tl-msgbar { display: none; gap: 10px; align-items: center; padding: 8px 2px 0; }

<body>
<header>
  <span class="brand"><span class="glyph">◈</span> tx-ide</span>
  <nav class="tabs">
    <a id="tab-chats" href="#/">chats</a>
    <a id="tab-artifacts" href="#/artifacts">artifacts</a>
    <a id="tab-timeline" href="#/timeline">timeline</a>
  </nav>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="filter…" autocomplete="off">
  <span id="hot-window" title="hot window — a session interacted with inside it gets a green name and surfaces out of collapsed trees">
    <span class="hot-label"><b>hot</b> &lt;</span>
    <input id="hot-value" type="number" min="1" step="1" autocomplete="off">
    <select id="hot-unit"><option value="min">min</option><option value="h">h</option></select>
  </span>
  <a class="muted" id="nav-refresh" style="font-size:13px">↻</a>
</header>
<main id="app"><div class="empty">loading…</div></main>

<script>
"use strict";
const app = document.getElementById("app");
const searchBox = document.getElementById("search");
const tabChats = document.getElementById("tab-chats");
const tabArtifacts = document.getElementById("tab-artifacts");
const tabTimeline = document.getElementById("tab-timeline");
const hotWindowControl = document.getElementById("hot-window");
const hotValueInput = document.getElementById("hot-value");
const hotUnitSelect = document.getElementById("hot-unit");

// ---- helpers ----
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Short-lived request memo: the auto-refresh tick fetches a view's payloads to fingerprint them,
// then re-renders through route() — the memo makes that second read free instead of a double fetch.
const _fetchCache = new Map();  // url -> {at, promise}
const FETCH_REUSE_MS = 2000;
async function getJSON(url, fresh) {
  const hit = _fetchCache.get(url);
  if (!fresh && hit && Date.now() - hit.at < FETCH_REUSE_MS) return hit.promise;
  const promise = (async () => {
    const r = await fetch(url);
    if (!r.ok) { let j = {}; try { j = await r.json(); } catch (e) {} throw new Error(j.error || ("HTTP " + r.status)); }
    return r.json();
  })();
  _fetchCache.set(url, { at: Date.now(), promise });
  try { return await promise; }
  catch (e) { _fetchCache.delete(url); throw e; }
}
function shortId(id) { return id && id.length > 12 ? id.slice(0, 8) : (id || ""); }
function fmtBytes(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}
function fmtTs(epoch) {
  if (!epoch) return "";
  const d = new Date(epoch * 1000), now = new Date();
  const hm = d.toTimeString().slice(0, 5);
  if (d.toDateString() === now.toDateString()) return hm;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + hm;
}
function chips(tags, colors) {
  return (tags || []).map(t => {
    const color = (colors && colors[t]) || "var(--dim)";
    return '<span class="chip" style="--chip:' + esc(color) + '">' + esc(t) + "</span>";
  }).join("");
}
// Group chip for any row carrying the server's group triple.
function groupChip(row) {
  if (!row.resolved_group) return "";
  const how = row.group ? "explicit override" : "derived from lineage";
  return '<span class="chip gchip" style="--chip:' + esc(row.group_color || "var(--dim)") +
    '" title="effort group (' + how + ')">⊙ ' + esc(row.resolved_group) + "</span>";
}
function stateHtml(state) {
  return '<span class="state st-' + esc(state) + '"><span class="dot"></span>' + esc(state) + "</span>";
}
function sessionLink(id, name, exists) {
  if (!exists) return '<span class="mono" title="' + esc(id) + '">' + esc(name) + "</span>";
  return '<a class="mono" href="#/chats/' + esc(id) + '" title="' + esc(id) + '">' + esc(name) + "</a>";
}

// ---- a self-contained markdown renderer (no external libs) ----
// Sized for what artifacts actually are: hard-wrapped prose plans, heavy on nested lists, inline
// code and tables. The parser is line-based and block-structured — every construct collects its own
// lines and recurses, which is what makes continuation and nesting work at all. Not CommonMark, but
// it covers headings, fences, lists (nested, wrapped, loose/tight), tables, quotes and paragraphs.
const MD_BULLET = /^(\s*)([-*+])(\s+)(.*)$/;
const MD_ORDERED = /^(\s*)(\d{1,9})[.)](\s+)(.*)$/;
const MD_FENCE = /^\s{0,3}(```+|~~~+)\s*([^\s`]*)/;
const MD_HEADING = /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/;
const MD_RULE = /^\s{0,3}(?:(?:-\s*){3,}|(?:\*\s*){3,}|(?:_\s*){3,})$/;
const MD_QUOTE = /^\s{0,3}>\s?(.*)$/;

function renderMarkdown(text) {
  return mdBlocks(text.replace(/\r\n?/g, "\n").split("\n")).join("\n");
}

// The head of a list item — where its marker sits and, crucially, the column its CONTENT starts at.
// That column is what later lines are measured against to decide "still this item" vs "next block".
function mdItemHead(line) {
  const bullet = line.match(MD_BULLET);
  if (bullet) {
    return { indent: bullet[1].length, ordered: false, text: bullet[4],
             content: bullet[1].length + 1 + bullet[3].length };
  }
  const ordered = line.match(MD_ORDERED);
  if (!ordered) return null;
  return { indent: ordered[1].length, ordered: true, text: ordered[4],
           content: ordered[1].length + ordered[2].length + 1 + ordered[3].length,
           start: Number(ordered[2]) };
}

function mdBlocks(lines) {
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === "") { i++; continue; }
    if (MD_RULE.test(line)) { out.push("<hr>"); i++; continue; }
    const fence = line.match(MD_FENCE);
    if (fence) { i = mdFence(lines, i, fence, out); continue; }
    const heading = line.match(MD_HEADING);
    if (heading) {
      const level = heading[1].length;
      out.push("<h" + level + ">" + mdInline(heading[2]) + "</h" + level + ">");
      i++;
      continue;
    }
    if (MD_QUOTE.test(line)) { i = mdQuote(lines, i, out); continue; }
    const table = mdTable(lines, i);
    if (table) { out.push(table.html); i = table.next; continue; }
    if (mdItemHead(line)) { i = mdList(lines, i, out); continue; }
    i = mdParagraph(lines, i, out);
  }
  return out;
}

function mdFence(lines, i, fence, out) {
  const marker = fence[1], language = fence[2];
  const body = [];
  i++;
  while (i < lines.length && !new RegExp("^\\s{0,3}" + marker[0] + "{" + marker.length + ",}\\s*$").test(lines[i])) {
    body.push(lines[i]);
    i++;
  }
  out.push('<pre><code' + (language ? ' class="lang-' + esc(language) + '"' : "") + ">" +
    esc(body.join("\n")) + "</code></pre>");
  return i + 1;   // past the closing fence (or past the end, for an unterminated one)
}

function mdQuote(lines, i, out) {
  const body = [];
  // A quote absorbs lazy continuations too: a wrapped quote paragraph drops the '>' on later lines.
  while (i < lines.length && lines[i].trim() !== "") {
    const quoted = lines[i].match(MD_QUOTE);
    if (!quoted && !body.length) break;
    if (!quoted && mdStartsBlock(lines[i])) break;
    body.push(quoted ? quoted[1] : lines[i].trim());
    i++;
  }
  out.push("<blockquote>" + mdBlocks(body).join("\n") + "</blockquote>");
  return i;
}

function mdStartsBlock(line) {
  return MD_RULE.test(line) || MD_FENCE.test(line) || MD_HEADING.test(line) ||
    MD_QUOTE.test(line) || !!mdItemHead(line);
}

// Lists: the construct the old renderer got wrong, and the one these documents lean on hardest.
// An item keeps collecting lines while they are indented to its content column (nested blocks) OR
// are a plain wrapped continuation of its paragraph. Each item's collected lines are de-indented and
// run back through mdBlocks, so nesting, code and sub-lists inside an item all just work.
function mdList(lines, i, out) {
  const first = mdItemHead(lines[i]);
  const items = [];
  let loose = false, blank = false;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === "") { blank = true; i++; continue; }
    const indent = line.length - line.trimStart().length;
    const head = mdItemHead(line);
    if (head && indent <= first.indent + 1) {
      if (head.ordered !== first.ordered) break;      // a different list kind starts a new list
      if (blank && items.length) loose = true;
      blank = false;
      items.push({ content: head.content, lines: [head.text] });
      i++;
      continue;
    }
    if (!items.length) break;
    const item = items[items.length - 1];
    const indented = indent >= item.content;
    // A blank line only continues the item if what follows is indented into it; otherwise the list
    // has ended. Un-indented text with no blank before it is a wrapped line of the same paragraph.
    if (!indented && (blank || mdStartsBlock(line))) break;
    if (blank) { item.lines.push(""); loose = true; blank = false; }
    item.lines.push(indented ? line.slice(item.content) : line.trim());
    i++;
  }
  const html = items.map(item => {
    const blocks = mdBlocks(item.lines);
    // A tight list drops the wrapper around its item's FIRST paragraph — only the first, so an item
    // that also carries a nested list keeps that list as a proper block.
    if (!loose && blocks.length && blocks[0].startsWith("<p>")) {
      blocks[0] = blocks[0].slice(3, -4);
    }
    return "<li>" + blocks.join("\n") + "</li>";
  }).join("");
  const tag = first.ordered ? "ol" : "ul";
  const start = first.ordered && first.start !== 1 ? ' start="' + first.start + '"' : "";
  out.push("<" + tag + start + ">" + html + "</" + tag + ">");
  return i;
}

function mdTable(lines, i) {
  if (!lines[i].includes("|")) return null;
  const divider = lines[i + 1];
  if (!divider || !/^\s{0,3}\|?[\s:|-]+\|[\s:|-]+$/.test(divider) || !divider.includes("-")) return null;
  const cells = row => row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(cell => cell.trim());
  const align = cells(divider).map(spec => {
    const left = spec.startsWith(":"), right = spec.endsWith(":");
    return left && right ? "center" : right ? "right" : "";
  });
  const cell = (tag, text, column) =>
    "<" + tag + (align[column] ? ' style="text-align:' + align[column] + '"' : "") + ">" +
    mdInline(text) + "</" + tag + ">";
  let html = '<div class="tablewrap"><table><thead><tr>' +
    cells(lines[i]).map((text, column) => cell("th", text, column)).join("") + "</tr></thead><tbody>";
  let next = i + 2;
  while (next < lines.length && lines[next].includes("|") && lines[next].trim() !== "") {
    html += "<tr>" + cells(lines[next]).map((text, column) => cell("td", text, column)).join("") + "</tr>";
    next++;
  }
  return { html: html + "</tbody></table></div>", next };
}

function mdParagraph(lines, i, out) {
  const body = [lines[i]];
  i++;
  while (i < lines.length && lines[i].trim() !== "" && !mdStartsBlock(lines[i]) && !mdTable(lines, i)) {
    body.push(lines[i]);
    i++;
  }
  // Hard-wrapped source: the newlines are the author's line width, not their intent.
  out.push("<p>" + mdInline(body.join("\n").replace(/\n/g, " ")) + "</p>");
  return i;
}

// ---- inline ----
// Code spans come out FIRST, behind placeholders, so no later rule can reach inside them (a `**`
// or an underscore in a code span is code, not emphasis) and their contents are escaped once at the
// end. Everything after that operates on already-escaped text.
function mdInline(text) {
  // The sentinel is a private-use code point: a printable delimiter would collide with the
  // document's own words, and restoring " 3 " in prose as a code span is exactly that bug.
  const codes = [];
  let out = text.replace(/(`+)([^`]|[^`][\s\S]*?)\1(?!`)/g, (whole, ticks, code) =>
    "\uE000" + (codes.push(code.replace(/^ (.*) $/, "$1")) - 1) + "\uE000");
  out = esc(out);
  out = out.replace(/!\[([^\]]*)\]\(((?:[^()\s]|\([^()\s]*\))+)(?:\s+&quot;[^)]*&quot;)?\)/g, (whole, alt, url) => {
    const safe = mdUrl(url);
    return safe ? '<img src="' + safe + '" alt="' + alt + '">' : alt;
  });
  out = out.replace(/\[([^\]]+)\]\(((?:[^()\s]|\([^()\s]*\))+)(?:\s+&quot;[^)]*&quot;)?\)/g, (whole, label, url) => mdLink(label, url));
  out = out.replace(/&lt;((?:https?|mailto):[^\s&]+)&gt;/g, (whole, url) => mdLink(url, url));
  out = out.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[\s(])__(?=\S)([\s\S]*?\S)__(?![\w])/g, "$1<strong>$2</strong>");
  out = out.replace(/(^|[^*\w])\*(?=\S)([^*\n]*?\S)\*(?!\*)/g, "$1<em>$2</em>");
  out = out.replace(/(^|[^_\w])_(?=\S)([^_\n]*?\S)_(?![\w])/g, "$1<em>$2</em>");
  out = out.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
  return out.replace(/\uE000(\d+)\uE000/g, (whole, index) => "<code>" + esc(codes[Number(index)]) + "</code>");
}

// Artifact text is written by whoever wrote the artifact, so a link target is untrusted input: only
// schemes that cannot execute are emitted, and the value is quoted safely into the attribute. The
// old renderer interpolated the raw URL straight into href — `javascript:` ran, and a quote in the
// URL escaped the attribute.
function mdUrl(url) {
  // The caller hands this ALREADY-escaped text, so a raw quote can no longer reach the attribute
  // and re-escaping here would double every entity (`&` -> `&amp;amp;`).
  const target = url.trim();
  if (!/^(?:https?:\/\/|mailto:|#|\/|\.{1,2}\/)/i.test(target)) return null;
  return target.replace(/"/g, "%22");
}
function mdLink(label, url) {
  const safe = mdUrl(url);
  if (!safe) return label;   // an unsupported scheme degrades to its plain label, never a live link
  return '<a href="' + safe + '" target="_blank" rel="noopener noreferrer">' + label + "</a>";
}

// ---- search (client-side filter over the current list) + subtree collapse ----
// Collapse works like Notion sub-items: a parent row's chevron folds its whole subtree; everything
// starts collapsed; the expanded set persists. A non-empty search overrides collapse — matches
// surface wherever they nest — and clearing it restores the folded view.
let filterables = [];   // [{row: <tr>, text: lowercased haystack}]
const EXPAND_KEY = "txide-chats-expanded";
let expanded = new Set();
try { expanded = new Set(JSON.parse(localStorage.getItem(EXPAND_KEY) || "[]")); } catch (e) {}
function applyFilter() {
  const needle = searchBox.value.trim().toLowerCase();
  for (const item of filterables) {
    const anchor = item.row.dataset.promo;   // set on a promoted (hot, out-of-place) row
    const ancestors = item.row.dataset.anc ? item.row.dataset.anc.split(" ") : [];
    let show;
    if (needle !== "") {
      // Search shows real positions only — a promoted duplicate would double every match.
      show = !anchor && item.text.includes(needle);
    } else if (anchor) {
      // A promoted row shows exactly while its anchor is the visible collapsed ancestor.
      show = !expanded.has(anchor) && ancestors.every(id => expanded.has(id));
    } else {
      show = ancestors.every(id => expanded.has(id));
    }
    item.row.hidden = !show;
  }
}
searchBox.addEventListener("input", applyFilter);
function bindFilter(tbody) {
  filterables = Array.from(tbody.rows).map(row => ({ row, text: row.textContent.toLowerCase() }));
  applyFilter();
}
function toggleSubtree(id, tbody) {
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  localStorage.setItem(EXPAND_KEY, JSON.stringify([...expanded]));
  tbody.querySelectorAll('.gut[data-id="' + id + '"] .tgl').forEach(t => {
    t.textContent = expanded.has(id) ? "▾" : "▸";
  });
  applyFilter();
}

// ---- hot window ----
// How recent a session's last interaction must be to count as "hot" — green name, promotion out
// of collapsed trees (renderChats). Number + unit in the header, persisted like the fold state;
// the default matches the previously hardcoded one hour.
const HOT_KEY = "txide-chats-hot-window";
let hotWindow = { value: 1, unit: "h" };
try {
  const saved = JSON.parse(localStorage.getItem(HOT_KEY) || "null");
  if (saved && Number.isInteger(saved.value) && saved.value >= 1 &&
      (saved.unit === "min" || saved.unit === "h")) hotWindow = saved;
} catch (e) {}
function hotWindowSeconds() { return hotWindow.value * (hotWindow.unit === "h" ? 3600 : 60); }
function syncHotControl() { hotValueInput.value = hotWindow.value; hotUnitSelect.value = hotWindow.unit; }
syncHotControl();
// Applies live on every valid edit. An invalid number (empty, 0, junk) is never persisted; the
// "change" commit (blur/Enter) snaps the field back to the last good value instead. The re-render
// must be explicit — the auto-refresh tick fingerprints server payloads only.
function applyHotWindow(commit) {
  const value = Math.round(Number(hotValueInput.value));
  if (hotValueInput.value.trim() === "" || !Number.isFinite(value) || value < 1) {
    if (commit) syncHotControl();
    return;
  }
  if (value !== hotWindow.value || hotUnitSelect.value !== hotWindow.unit) {
    hotWindow = { value, unit: hotUnitSelect.value };
    localStorage.setItem(HOT_KEY, JSON.stringify(hotWindow));
    route();
  } else if (commit) syncHotControl();
}
hotValueInput.addEventListener("input", () => applyHotWindow(false));
hotValueInput.addEventListener("change", () => applyHotWindow(true));
hotUnitSelect.addEventListener("change", () => applyHotWindow(false));

// ---- chats list ----
// The list is a forest: a session spawned from another session (record `parent`) indents under it.
// Ordering standard: a family sorts by its subtree's NEWEST interaction (a subsession update
// bubbles its ancestors up, like a mail thread sorting by newest message); siblings sort by their
// own subtree recency.
function sessionForest(sessions) {
  const byId = new Map(sessions.map(s => [s.id, s]));
  const children = new Map();
  const roots = [];
  for (const s of sessions) {
    if (s.parent && byId.has(s.parent) && s.parent !== s.id) {
      if (!children.has(s.parent)) children.set(s.parent, []);
      children.get(s.parent).push(s);
    } else roots.push(s);
  }
  const subtreeLast = s => {
    const kids = children.get(s.id) || [];
    return Math.max(s.last_epoch, ...kids.map(subtreeLast));
  };
  const flat = [];
  const walk = (list, depth, root, ancestors) => {
    list.sort((a, b) => subtreeLast(b) - subtreeLast(a));
    for (const s of list) {
      flat.push({
        s, depth, root: root || s, ancestors, driver: false, familyDriver: null,
        hasChildren: children.has(s.id),
      });
      walk(children.get(s.id) || [], depth + 1, root || s, [...ancestors, s.id]);
    }
  };
  walk(roots, 0, null, []);
  // Per family: the row whose own time IS the subtree's newest — the one that lifted the tree to
  // its list position. Mark it, and hand the root its time so the sort key is visible up top.
  const byRoot = new Map();
  for (const entry of flat) {
    if (!byRoot.has(entry.root.id)) byRoot.set(entry.root.id, []);
    byRoot.get(entry.root.id).push(entry);
  }
  for (const family of byRoot.values()) {
    const driver = family.reduce((a, b) => (b.s.last_epoch > a.s.last_epoch ? b : a));
    if (driver.s.id === family[0].s.id) continue;   // the root itself is the newest — nothing to explain
    driver.driver = true;
    family[0].familyDriver = driver.s;
  }
  return flat;
}

async function renderChats() {
  setNav("chats", true);
  app.innerHTML = '<div class="empty">loading…</div>';
  let data;
  try { data = await getJSON("/api/chats"); }
  catch (e) { app.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }
  if (!data.sessions.length) { app.innerHTML = '<div class="empty">No chat sessions recorded yet.</div>'; return; }
  const now = Date.now() / 1000;
  const isHot = s => now - s.last_epoch < hotWindowSeconds();
  const entries = sessionForest(data.sessions);
  // Hot descendants per ancestor: a nested session with interaction inside the hot window gets one
  // PROMOTED row under every ancestor; visibility rules make exactly the one under the visible
  // collapsed ancestor show, so a folded tree surfaces the session responsible for its freshness.
  const promotedByAnchor = new Map();
  for (const entry of entries) {
    if (!entry.ancestors.length || !isHot(entry.s)) continue;
    for (const ancestorId of entry.ancestors) {
      if (!promotedByAnchor.has(ancestorId)) promotedByAnchor.set(ancestorId, []);
      promotedByAnchor.get(ancestorId).push(entry);
    }
  }

  const cells = (s, last) =>
    '<td>' + groupChip(s) + chips(s.tags, s.tag_colors) + '</td>' +
    '<td>' + stateHtml(s.state) + '</td>' +
    '<td class="muted mono" style="font-size:12px">' + esc(s.engine) + '</td>' +
    '<td class="right num">' + s.chats + '</td>' +
    '<td class="right">' + (s.artifacts
      ? '<span class="num">' + s.artifacts + "</span>"
      : '<span class="num zero">—</span>') + '</td>' +
    '<td class="right muted mono" style="font-size:12px">' + last + '</td>';

  const rows = entries.map(({ s, depth, ancestors, driver, familyDriver, hasChildren }) => {
    const indent = '<span style="display:inline-block;width:' + depth * 22 + 'px"></span>';
    // Parents: indent + chevron wrapped in one fat clickable gutter. Leaves: plain spacers.
    const gutter = hasChildren
      ? '<span class="gut" data-id="' + esc(s.id) + '" title="fold/unfold">' + indent +
        '<span class="tgl">' + (expanded.has(s.id) ? "▾" : "▸") + "</span></span>"
      : indent + '<span class="tgl-spacer"></span>';
    let last = esc(s.last_ago);
    if (familyDriver) {
      last = '<span class="fresh" title="newest in this tree: ' + esc(familyDriver.name) + '">' +
        esc(familyDriver.last_ago) + '</span> <span class="own">· ' + esc(s.last_ago) + "</span>";
    } else if (driver) {
      last = '<span class="fresh" title="newest in this tree — keeps it at this position">' + last + "</span>";
    }
    const hot = ancestors.length && isHot(s);
    let html = '<tr class="rowlink" data-href="#/chats/' + esc(s.id) + '"' +
      (ancestors.length ? ' data-anc="' + ancestors.map(esc).join(" ") + '"' : "") + '>' +
      '<td>' + gutter +
      '<b' + (hot ? ' class="hot"' : "") + '>' + esc(s.name) + '</b></td>' + cells(s, last) + "</tr>";
    // Promoted duplicates of this node's hot descendants, right below it — shown only while this
    // node is the visible collapsed ancestor (applyFilter), so they never coexist with the real rows.
    for (const hotEntry of (promotedByAnchor.get(s.id) || []).slice().sort((a, b) => b.s.last_epoch - a.s.last_epoch)) {
      const anchorAncestors = hotEntry.ancestors.slice(0, hotEntry.ancestors.indexOf(s.id));
      html += '<tr class="rowlink" data-href="#/chats/' + esc(hotEntry.s.id) + '"' +
        ' data-promo="' + esc(s.id) + '"' +
        (anchorAncestors.length ? ' data-anc="' + anchorAncestors.map(esc).join(" ") + '"' : "") + '>' +
        '<td><span style="display:inline-block;width:' + (depth + 1) * 22 + 'px"></span>' +
        '<span class="tgl-spacer"></span>' +
        '<b class="hot" title="active ' + esc(hotEntry.s.last_ago) + ' ago inside this tree — expand ▸ to see its place">' +
        esc(hotEntry.s.name) + "</b></td>" +
        cells(hotEntry.s, '<span class="fresh">' + esc(hotEntry.s.last_ago) + "</span>") + "</tr>";
    }
    return html;
  }).join("");
  app.innerHTML =
    '<table class="grid"><thead><tr>' +
    '<th>session</th><th>group · tags</th><th>state</th><th>engine</th>' +
    '<th class="right">chats</th><th class="right">artifacts</th><th class="right">last</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
  const tbody = app.querySelector("tbody");
  tbody.addEventListener("click", e => {
    const gutter = e.target.closest(".gut");
    if (gutter) { toggleSubtree(gutter.dataset.id, tbody); return; }
    const row = e.target.closest("tr[data-href]");
    if (row && !e.target.closest("a")) location.hash = row.dataset.href.slice(1);
  });
  bindFilter(tbody);
}

  setNav("chats", false);
  app.innerHTML = '<div class="empty">loading…</div>';
  let d;
  try { d = await getJSON("/api/chats/" + encodeURIComponent(id)); }
  catch (e) { app.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }

      '<td><span class="chip">' + esc(c.role) + '</span></td>' +

      '<td style="font-size:13px">' + origin + '</td>' +
      '<td class="muted mono" style="font-size:12px">' + esc(c.started_ago) + ' ago</td>' +

  const artRows = d.artifacts.map(a =>
    '<tr class="rowlink" data-href="#/artifacts/' + esc(a.id) + '">' +

  const derivedRows = d.derived.map(x =>
    '<tr><td>' + sessionLink(x.id, x.name, true) + '</td>' +

    (d.artifacts.length ?
